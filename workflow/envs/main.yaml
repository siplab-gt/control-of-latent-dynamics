# mostly has snakemake dependencies
# others are defined in pyproject.toml and are included in the pip install
name: cold
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12.7
  - pip
  # - cuda-11.6 # for brian2cuda
  - snakemake
  # conda>=24.7.1 removed - not strictly required and PACE system has 24.1.2
  - pip:
      - -e ../..
      - snakemake-logger-plugin-snkmt
      - snakemake-executor-plugin-slurm

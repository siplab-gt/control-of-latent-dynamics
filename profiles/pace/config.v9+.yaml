# this is for PACE cluster-specific things
# workflow-specific things are in profiles/default/config.v9+.yaml
executor: slurm
jobs: 495 # just under 500 limit to be safe
# resources:
#   gpu_jobs: 500
#   gpu: 32
# NOTE: Removed sdm: conda due to PACE conda version (24.1.2) not meeting
# Snakemake 8.x requirement (24.7.1+). Using pre-activated USID env instead.
default-resources:
  # slurm_account: gts-crozell3
  # tasks_per_gpu: 0
  mem_mb: 4000
  runtime: 60

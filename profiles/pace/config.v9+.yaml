# this is for PACE cluster-specific things
# workflow-specific things are in profiles/default/config.v9+.yaml
executor: slurm
jobs: 495 # just under 500 limit to be safe
logger: snkmt
resources:
  gpu_jobs: 500 # not sure. old PPT said 10, but not on docs.
  gpu: 32 # on current docs: https://gatech.service-now.com/technology?id=kb_article_view&sysparm_article=KB0041998
sdm: conda
conda-prefix: $HOME/.conda/smk-conda
default-resources:
  slurm_account: gts-crozell3
  # since slurm executor sets to 1, which breaks
  tasks_per_gpu: 0
 
name: Syntax and DAG planning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install planning dependencies only
        run: python -m pip install 'snakemake==9.16.2' numpy pandas 'snakefmt==2.1.0'
      - name: Check Python syntax (no imports)
        run: python -m compileall -q src
      - name: Check Snakefile formatting
        run: snakefmt --check workflow/Snakefile
      # Existing lint findings include missing logs/environments and a false
      # absolute-path warning for "/".join(...); retain visibility, not a gate.
      - name: Workflow lint (advisory)
        continue-on-error: true
        run: >-
          python -m snakemake -n --lint --profile none --workflow-profile none
          --cores 1 --snakefile workflow/Snakefile --configfile config/testconfig.yaml
          -- results/test/task_reaching/seed_17230616/n_latent_dims_offset_0/density_scale_1/network_area_scale_1.44/fsnn_post_train.pkl.gz
      # Plans only two preparation jobs; no simulation, CUDA, conda, or report.
      - name: Plan bounded test DAG (no execution)
        run: >-
          python -m snakemake -n --profile none --workflow-profile none
          --cores 1 --snakefile workflow/Snakefile --configfile config/testconfig.yaml
          -- results/test/task_reaching/seed_17230616/n_latent_dims_offset_0/density_scale_1/network_area_scale_1.44/fsnn_post_train.pkl.gz

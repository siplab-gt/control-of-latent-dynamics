
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control_latent_dynamics"
version = "0.1.0"
description = "Source code for Control of Latent Dynamics"
dependencies = [
    'numpy',
    'pandas',
    'matplotlib',
    'cleosim==0.18.2',
    'dill',
    'seaborn',
    'scikit-learn',
    'BRAID @ git+https://github.com/kjohnsen/BRAID.git@56a68e#subdirectory=source',
    'cvxpy',
    'brian2cuda',
]

[tool.setuptools]
packages = ["src"]

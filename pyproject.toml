
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control_latent_dynamics"
version = "0.1.0"
description = "Source code for Control of Latent Dynamics"
dependencies = [
    'numpy',
    'numba',
    'pandas',
    'matplotlib',
    'cleosim @ git+https://github.com/siplab-gt/cleo.git@1662ede4beefde2e538e2c6b3984bbe975b43e8a',  # v0.19.0 (multi-source light-aggregation fix)
    'dill',
    'seaborn',
    'scikit-learn',
    'BRAID @ git+https://github.com/kjohnsen/BRAID.git@680db8#subdirectory=source',
    'cvxpy',
    'brian2cuda',
    'tqdm',
    'tensorflow[and-cuda]',
    'marimo',
]

[tool.setuptools]
package-data = { "fsnn" = ["*/npz"] }
packages = ["src"]

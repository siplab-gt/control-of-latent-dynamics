
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control_latent_dynamics"
version = "0.1.0"
description = "Source code for Control of Latent Dynamics"
dependencies = [
    'numpy',
    'numba',
    'pandas',
    'matplotlib',
    'cleosim @ git+https://github.com/siplab-gt/cleo.git@c2689aaaed814529bdea25eb8cdd98b3b79bf28b',
    'dill',
    'seaborn',
    'scikit-learn',
    'BRAID @ git+https://github.com/kjohnsen/BRAID.git@680db8#subdirectory=source',
    'cvxpy',
    'brian2cuda',
    'tqdm',
    'tensorflow[and-cuda]',
    'marimo',
    'infomeasure @ git+https://github.com/kjohnsen/infomeasure.git@........',
]

[tool.setuptools]
package-data = { "fsnn" = ["*/npz"] }
packages = ["src"]

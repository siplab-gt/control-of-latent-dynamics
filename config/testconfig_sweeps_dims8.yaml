# =============================================================================
# testconfig_sweeps_dims8.yaml — USID latent-dimension test (n1=8, n2=8).
#
# Hypothesis under test: does increasing the USID model latent dimension from
# 4/4 (total 8 state) to 8/8 (total 16 state) improve USID+opsin identification
# enough to lift closed-loop Q on the fSNN? BRAID is UNAFFECTED by this change
# (it uses its own subspace ID, not cold_usid.yaml models.n1/n2), so its anchor
# from 9531682 still holds and is not re-run here.
#
# USID+opsin only, NLMPC (the valid opsin-in-loop controller; +NULL auto = the
# Q_track baseline). 5 seeds (same set as 9531682 for before/after), k=m=32,
# nlmpc_grad_iters=300. Run via tmp/cold_nlmpc_fix/run_dims8_phim_sweep.sbatch
# at phim 60 (ample authority) then 1 (saturating target).
# =============================================================================

sweeps:
  seed:
    - 17230616
    - 18051223
    - 16320829
    - 18060520
    - 18220427
  ctrl_type:
    - NLMPC
  setting:
    - usid_stim_rec
  nlmpc_grad_iters:
    - 300
  n_trials_sys_id:
    - 50

q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 3
  target_k: 32

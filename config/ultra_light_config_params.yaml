# =============================================================================
# ultra_light_config_params.yaml — absolute-minimum smoke test (params block).
#
# Bare-minimum wiring-check config (<15 min end-to-end). Fits are
# intentionally useless (too few trials, too few epochs) but every DAG rule
# fires, catching import / shape / unit bugs that `snakemake -n` + unit
# tests can't.
#
# Companion ultra_light_config_sweeps.yaml provides Cartesian-product axes;
# any axis not listed there is held at its default value below.
#
# Reductions vs testconfig_params.yaml:
#   - 1 seed (was 5)
#   - 1 k/m pair via num_stim_ratio_levels=1 (was 4)
#   - prep_fsnn_{demean,train,test} trial counts cut to minimum
#   - n_trials_sys_id=5, n_trials_natural=3, n_trials_ctrl=2
#   - usid_overrides drops natural + USID training to 2 epochs each
#
# Do NOT use for quality evaluation.
# =============================================================================

# Parameter defaults — used when a param is not present in the sweeps file.
params:
  task: reaching
  seed: 17230616
  n_latent_dims_offset: -2
  density_scale: 1
  network_area_scale: 1.44
  setting: usid_stim_rec
  beam_width_um: 100
  signals: lfp
  n_trials_sys_id: 5
  model_task_inputs: false
  # sys-ID opto excitation (sys_id_expts wildcards). stim_u_max_mWmm2 = amplitude
  # cap (mW/mm²) + lognormal spread; stim_active_frac = per-channel per-step Bernoulli
  # on-prob (sparsity). Defaults = control-regime excitation; 75 / 1.0 = legacy dense
  # saturating drive.
  stim_u_max_mWmm2: 30
  stim_active_frac: 0.5
  # USID model_fit-level loss-weight wildcards (route into usid_overrides via
  # src/scripts/model_fit.py): forced = usid_hyperparams.loss.loss_weights.forced
  # (forced-loss weight). Defaults match the static cold_usid.yaml values so a run
  # that does not sweep them carries the committed behaviour.
  forced: 1.0
  usid_rollout: 0.1      # USID open-loop rollout loss weight (model_fit wildcard); 0.1 = committed default
  n_restarts: 1           # USID base-fit multistart count (model_fit wildcard); 1 = single fit. >1 = keep best forced-path R2(Y) base, Phase-4 on winner.
  cz2_warm: ridge         # Phase-4 Cz2 init (model_fit wildcard); ridge = warm-start (committed default) | random = random init.
  b1_z: 10.0              # Phase 2 {B1',Cz1} pretrain z (behavior) weight (model_fit wildcard); 10.0 = cold_usid default. 0 = LFP-only.
  b1_y: 1.0               # Phase 2 {B1',Cz1} pretrain y (LFP) anchor weight (model_fit wildcard); 1.0 = cold_usid default. 0 = behavior-only.
  b2_z: 10.0              # Phase 4 {Cz2,B2'} finetune z (behavior) weight (model_fit wildcard); 10.0 = cold_usid default (de-saturation lever).
  b2_y: 1.0               # Phase 4 {Cz2,B2'} finetune y (LFP) anchor weight (model_fit wildcard); 1.0 = cold_usid default.
  usid_teacher: 0.1       # USID teacher loss weight (model_fit wildcard; co-overrides loss_weights.teacher + schedule.teacher); 0.1 = cold_usid default. 0 = drop teacher (clean tf-only with forced=0, usid_rollout=0).
  usid_delta: 1.0         # USID delta-of-rollout loss weight (model_fit wildcard; plain leaf, NO schedule); 1.0 = cold_usid default. 0 = isolate the rollout-level axis (no delta-of-rollout conflation).
  latency: false
  ctrl_type: LQMPC
  ctrl_horizon_ms: 300
  nlmpc_grad_iters: 2
  k: 22
  m: 42

# Top-level architectural switches
power_per_neuron_uW: 1
model_fit_method: "usid"
use_opsin: true
opsin_checkpoint_path: null
report_period_s: 60
train_device: cuda
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

# Deep-merged onto the USID merged config by src/model_fit/usid.py.
usid_overrides:
  natural_hyperparams:
    epochs: 2
  usid_hyperparams:
    epochs: 2

# Rule-specific blocks (copied verbatim from previous ultra_light_config.yaml).
prep_fsnn:
  dt_ms: 1
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231
    - 1.539
    - 1
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 2
  n_main_trials: 3
  n_settle_trials: 1
prep_fsnn_train:
  n_main_trials: 2
  n_settle_trials: 1
prep_fsnn_test:
  n_main_trials: 3

prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 200
  n_trials_pca: 20
  g: 3

model_fit_braid_stim_rec_nonlinear:
  # See testconfig_params.yaml for full notes. BRAID with nonlinear Cz (MLP).
  model_fit_method: braid
  use_opsin: false
  linear_Cz: false
  epochs: 2
  steps_ahead_model_code: ""

model_fit_usid_stim_rec:
  # Placeholder block injected by Snakemake's step_cfg("model_fit", "usid_stim_rec")
  # lookup. Actual epoch reduction is via usid_overrides above.
  epochs: 2500
  steps_ahead_model_code: ""

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  n_trials_ctrl: 2
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_step_size: 0.5

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

ctrl_expts_iLQR:
  ilqr_tol: 1e-4
  ilqr_mu_init: 1e-3
  ilqr_mu_min: 1e-6
  ilqr_mu_max: 1e6
  ilqr_mu_factor: 10.0

ctrl_expts_usid_stim_rec:
  ref_type: Z

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn
  opsin_calibration_dir: results/opsin_calibration

calibrate_opsin_plant:
  target_iopto: 0.165
  phim_scale: 5

# Ultra-light overrides: minimal sequences/epochs since this config is for
# DAG smoke tests, not for producing a usable opsin. See
# testconfig_params.yaml for the documented "good" values.
opsin_train_cold:
  n_sequences: 20
  time_steps: 100
  sequence_length: 50
  epochs: 50
  batch_size: 4
  lr: 3e-3
  hidden_size: 32
  num_layers: 2
  scheduler_patience: 200
  scheduler_factor: 0.8
  scheduler_min_lr: 1.0e-6
  seed: 42
  # Sustained on/off block light (opsin saturation-coverage fix, 2026-06-14). Trains
  # the NN on piecewise-constant ON blocks (amp ~U(0,sustain_amp_max), held for
  # sustain_steps) + sustained-zero OFF blocks, instead of pure-white lognormal.
  # Fixes the zero-light offset (off-blocks) and the high-light marginal-slope
  # over-statement (sustained-high blocks). The "high" variant (amp_max=75,
  # sustain<=160) is best on commanded light: dynamic R²(NN,biophysical 500um) 0.9993
  # vs white 0.9973, deep-saturation [50,75) bin 0.86->0.98. const_block_fraction=0
  # reproduces legacy all-white. See personal_notes cold_eval opsin_block_training doc.
  const_block_fraction: 0.6
  sustain_amp_max: 75
  sustain_steps_min: 40
  sustain_steps_max: 160
  off_steps_min: 10
  off_steps_max: 40
  block_on_probability: 0.5

model_fit:
  linear_Cz: true

expts:
  u_max_mWmm2: 75

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 3

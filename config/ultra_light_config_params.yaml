# =============================================================================
# ultra_light_config_params.yaml — absolute-minimum smoke test (params block).
#
# Bare-minimum wiring-check config (<15 min end-to-end). Fits are
# intentionally useless (too few trials, too few epochs) but every DAG rule
# fires, catching import / shape / unit bugs that `snakemake -n` + unit
# tests can't.
#
# Companion ultra_light_config_sweeps.yaml provides Cartesian-product axes;
# any axis not listed there is held at its default value below.
#
# Reductions vs testconfig_params.yaml:
#   - 1 seed (was 5)
#   - 1 k/m pair via num_stim_ratio_levels=1 (was 4)
#   - prep_fsnn_{demean,train,test} trial counts cut to minimum
#   - n_trials_sys_id=5, n_trials_natural=3, n_trials_ctrl=2
#   - usid_overrides drops natural + USID training to 2 epochs each
#
# Do NOT use for quality evaluation.
# =============================================================================

# Parameter defaults — used when a param is not present in the sweeps file.
params:
  task: reaching
  seed: 17230616
  n_latent_dims_offset: -2
  density_scale: 1
  network_area_scale: 1.44
  setting: usid_stim_rec
  beam_width_um: 100
  signals: lfp
  # Plant opto authority (cleo_prep-level cond-param); swept as a plant axis.
  # 0.8 (g0 2.79) = corrected-cleo mid-plateau operating-point default (see config_params.yaml).
  target_iopto: 0.8
  n_trials_sys_id: 5
  model_task_inputs: false
  # sys-ID opto excitation (sys_id_expts wildcards): OED-derived (src.opsin_oed) —
  # the light pattern maximizing the opsin's Fisher information at the operating point
  # (pulsed, graded-amplitude, with recovery gaps; replaces lognormal×Bernoulli).
  #   stim_u_max_mWmm2  = actuator amplitude cap (mW/mm²); light in [0, u_max].
  #   stim_budget_mWmm2 = mean-light budget = operating point (lower → more de-saturated).
  stim_method: oed   # oed|white|chirp (src.stim)
  stim_u_max_mWmm2: 75
  stim_budget_mWmm2: 6
  # opsin-NN training light distribution (src.opsin_stim; opsin_train_cold rule).
  # current_mix (60% blocks + 40% white, validated default) | ou (clipped OU colored noise).
  opsin_stim_method: logwalk
  # USID model_fit-level loss-weight wildcards (route into usid_overrides via
  # src/scripts/model_fit.py): each maps to a usid_hyperparams.loss.loss_weights leaf.
  # Defaults match the static cold_usid.yaml values so a run that does not sweep them
  # carries the committed behaviour.
  usid_rollout: 0.1      # USID open-loop rollout loss weight (model_fit wildcard); 0.1 = committed default
  usid_teacher: 0.1       # USID teacher loss weight (model_fit wildcard); 0.1 = cold_usid default. 0 = drop teacher (clean tf-only with usid_rollout=0).
  usid_delta: 1.0         # USID delta-of-rollout loss weight (model_fit wildcard); 1.0 = cold_usid default. 0 = isolate the rollout-level axis (no delta-of-rollout conflation).
  behavior_weight: 1.0    # Behavior-block weight in the augmented [LFP|behavior] reconstruction losses (model_fit wildcard; routes into the natural Phase-1 and unnatural Phase-3 recons). 1.0 = equal LFP/behavior blocks. >1 upweights behavior reconstruction.
  fold_behavior: 1        # observer fold (model_fit wildcard): 1 = full-output (default; behavior folded into K1/K2 observer); 0 = LFP-only (K behavior cols pinned 0, behavior a pure readout).
  natural_restarts: 1     # single fit per leg: this is a smoke config, and the ensemble multiplies fit cost
  usid_restarts: 1        # without changing the code paths it exercises.
  val_regime: rollout_dom # validation-loss criterion (model_fit wildcard): rollout_dom {delta:0.2,rollout:1.0} (= cold_usid.yaml) | delta_dom {delta:1.0,rollout:0.2}.
  pool_row_len: 800       # USID opto-pool row length in samples (model_fit wildcard, 10 ms/sample). Rows are cut from the contiguous recording; capped at half the recording when it is shorter.
  a11_max_radius: 0.99    # natural A11 Schur clamp (model_fit wildcard); slowest retained natural mode.
  a22_max_radius: 0.97    # unnatural A22 Schur clamp (model_fit wildcard); under zero_k2 this is the block the controller free-runs.
  a_cl_lim: 0.99          # rail on rho(A_cl)=rho(A_open-K*C) (model_fit wildcard), enforced by the init shrink and training guard; 1.0 admits boundary-riding observers.
  # Init-scale preset for the Jul-17 vs Jul-23 A/B: 'jul23' (shipped: K1/A12 at unit scale,
  # coupling and B' normalized by 1/sqrt of the summed dim) vs 'jul17' (flat 0.1), plus
  # jul17_{k1,a12,bprime,coupling} reverting one group at a time.
  init_scale: jul23
  latency: false
  ctrl_type: LQMPC
  ctrl_horizon_ms: 300
  nlmpc_grad_iters: 2
  k: 22
  m: 42

# Top-level architectural switches
power_per_neuron_uW: 1
model_fit_method: "usid"
use_opsin: true
opsin_checkpoint_path: null
# Debugging override: pin one opsin checkpoint FILE (.../<timestamp>/best_model.pth) instead of
# letting model_fit hand USID the method dir, from which it takes the highest-sorting run.
# Null in every production run; set it only to re-fit a past era against current code.
opsin_checkpoint_pin: null
report_period_s: 60
train_device: cuda
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

# Deep-merged onto the USID merged config by src/model_fit/usid.py.
usid_overrides:
  natural_hyperparams:
    epochs: 2
  usid_hyperparams:
    epochs: 2

# Rule-specific blocks (copied verbatim from previous ultra_light_config.yaml).
prep_fsnn:
  dt_ms: 1
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231
    - 1.539
    - 1
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 2
  n_main_trials: 3
  n_settle_trials: 1
prep_fsnn_train:
  n_main_trials: 2
  n_settle_trials: 1
prep_fsnn_test:
  n_main_trials: 3

prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 200
  n_trials_pca: 20
  g: 3

model_fit_braid_stim_rec_nonlinear:
  # See testconfig_params.yaml for full notes. BRAID with nonlinear Cz (MLP).
  model_fit_method: braid
  use_opsin: false
  linear_Cz: false
  epochs: 2
  steps_ahead_model_code: ""

model_fit_usid_stim_rec:
  # Placeholder block injected by Snakemake's step_cfg("model_fit", "usid_stim_rec")
  # lookup. Actual epoch reduction is via usid_overrides above.
  epochs: 2500
  steps_ahead_model_code: ""

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  n_trials_ctrl: 2
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_step_size: 0.5

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

ctrl_expts_iLQR:
  ilqr_tol: 1e-4
  ilqr_mu_init: 1e-3
  ilqr_mu_min: 1e-6
  ilqr_mu_max: 1e6
  ilqr_mu_factor: 10.0

ctrl_expts_usid_stim_rec:
  ref_type: Z

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn
  opsin_calibration_dir: results/opsin_calibration

calibrate_opsin_plant:
  target_iopto: 0.8
  phim_scale: 5

# Ultra-light overrides: minimal sequences/epochs since this config is for
# DAG smoke tests, not for producing a usable opsin. See
# testconfig_params.yaml for the documented "good" values.
opsin_train_cold:
  n_sequences: 20
  time_steps: 100
  sequence_length: 50
  epochs: 50
  batch_size: 4
  lr: 3e-3
  hidden_size: 32
  num_layers: 2
  scheduler_patience: 200
  scheduler_factor: 0.8
  scheduler_min_lr: 1.0e-6
  seed: 42
  # Sustained on/off block light (opsin saturation-coverage fix, 2026-06-14). Trains
  # the NN on piecewise-constant ON blocks (amp ~U(0,sustain_amp_max), held for
  # sustain_steps) + sustained-zero OFF blocks, instead of pure-white lognormal.
  # Fixes the zero-light offset (off-blocks) and the high-light marginal-slope
  # over-statement (sustained-high blocks). The "high" variant (amp_max=75,
  # sustain<=160) is best on commanded light: dynamic R²(NN,biophysical 500um) 0.9993
  # vs white 0.9973, deep-saturation [50,75) bin 0.86->0.98. const_block_fraction=0
  # reproduces legacy all-white. See personal_notes cold_eval opsin_block_training doc.
  const_block_fraction: 0.6
  sustain_amp_max: 75
  sustain_steps_min: 40
  sustain_steps_max: 160
  off_steps_min: 10
  off_steps_max: 40
  block_on_probability: 0.5

  # logwalk method knobs (src.opsin_stim). Only read when opsin_stim_method=logwalk.
  # Segment dwell is log-uniform on [1, dwell_max_steps], so this one leaf spans both of
  # current_mix's (dwell 1 = white, dwell ~160 = sustained block). reset_probability picks
  # a fresh log-uniform amplitude; otherwise the level is the previous one scaled by
  # exp(N(0, step_sigma)), which is what produces small steps away from a settled baseline.
  # ou method knobs (clipped Ornstein-Uhlenbeck colored noise; src.opsin_stim).
  ou_mu_mWmm2: 18.0
  ou_tau_ms: 120.0
  ou_std_mWmm2: 25.0
  logwalk_amp_min_mWmm2: 0.1
  logwalk_amp_max_mWmm2: 75.0
  logwalk_dwell_max_steps: 160
  logwalk_reset_probability: 0.35
  logwalk_step_sigma: 0.5
  logwalk_off_probability: 0.25
model_fit:
  linear_Cz: true

expts:
  u_max_mWmm2: 75

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 3

# (k, m) grid for the sweep, read by the Snakefile as config["q_usid"]. It lives here so a
# params-only invocation is legal; a sweeps file may override any of these keys.
#   channel_budget         total recorded channels; m = budget - k
#   num_stim_ratio_levels  how many k values to place across [1, budget-1]
#   target_k               optional filter to a single (k, m) pair
q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 1

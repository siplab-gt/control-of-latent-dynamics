# #############################################################################
# ##  DO NOT RUN THIS CONFIG UNTIL IT IS UNIFIED WITH testconfig_params.yaml ##
# #############################################################################
#
# Running this file instead of testconfig_params.yaml silently changed four things
# at once in the Aug-2026 runs and destroyed the control arm:
#
#   1. prep_fsnn_reaching.n_rate_neurons 800 here vs 200 in testconfig_params.yaml
#      (line 174 vs testconfig_params.yaml:139). It feeds fsnn_params
#      (workflow/Snakefile:1278-1289,1465), so Snakemake's params trigger regenerates
#      every fSNN plant, changing n_factors on 9/10 seeds. It also cascades into the
#      opsin calibration: rule measure_voperating_range consumes fsnn_post_train.pkl.gz
#      (Snakefile:926-938,981), so a different plant measures a different voltage
#      window and hence a different E (17.83 -> 19.41 observed).
#   2. This file has no model_fit_braid_stim_rec block and sets top-level
#      model_fit_method: usid + use_opsin: true (lines 112-113), so braid_stim_rec
#      falls through _resolve_model_fit_method (workflow/Snakefile:798-802) and runs
#      USID WITH THE OPSIN -- the BRAID control silently becomes a duplicate of the
#      USID arm. config_sweeps.yaml does not sweep `setting` (line 60 pins
#      usid_stim_rec), so this only bites when this file is paired with a sweep file
#      that does sweep it. testconfig_params.yaml carries the block (lines 164-170)
#      and deliberately omits a top-level default.
#   3. opsin_train_cold epochs/n_sequences/sequence_length/time_steps are all larger,
#      retraining the NN opsin on a different dataset.
#
# Unify the two files (port the model_fit_<setting> blocks and the calibrate_opsin_plant
# keys here, and decide n_rate_neurons deliberately), then DELETE THIS COMMENT.
#
# =============================================================================
# config_params.yaml — production COLD pipeline (params block).
#
# Single source of truth for parameter defaults + rule-specific config blocks.
# Sweep axes live in the companion config_sweeps.yaml; the cell budget is the
# full Cartesian product of those axes. Any axis not listed in sweeps falls
# back to its default below.
#
# Full-length quality-determining params (peer-validated reference that
# delivers fSNN R²(X)/R²(Z) ≈ 0.6-1.0 and supports the full v3 opsin pipeline):
#
#   block                                 keys                                  value(s)
#   ------------------------------------- ------------------------------------- -----------
#   prep_fsnn_demean                      n_init/n_main/n_settle                20 / 100 / 20
#   prep_fsnn_train                       n_main / n_settle                     250 / 20
#   prep_fsnn_test                        n_main                                50
#   prep_fsnn_reaching                    n_trials_pca                          100
#   natural_electrode_expts               n_trials_natural                      50
#   ctrl_expts                            n_trials_ctrl                         100
#   expts                                 u_max_mWmm2                           75
#   model_fit_usid_stim_rec               epochs                                2500
#
# Architectural switches (v3 pipeline wiring):
#   model_fit_method: usid
#   use_opsin: true
#   cleo_prep.opsin_plant_class: chr2_4s_fsnn
#   opsin_checkpoint_path: null  (use the opsin_train_cold checkpoint under
#                                 experiments/opsin_results_external/cold)
# =============================================================================

# Parameter defaults — used when a param is not present in the sweeps file.
# Every recognized condition param MUST have a default here.
params:
  task: reaching
  seed: 17230616
  n_latent_dims_offset: 0
  density_scale: 1
  network_area_scale: 1.44
  setting: usid_stim_rec
  beam_width_um: 100
  signals: lfp
  # Plant opto authority (cleo_prep-level cond-param): calibrate_opsin_plant target
  # photocurrent; g0 = target_iopto × 3.488, re-solved per value. 0.8 (g0 2.79) is the
  # mid-plateau operating point on the corrected cleo 0.19.0 plant: Q_track plateaus at
  # ~+0.40 (USID+oed +0.397 here) across g0 2.5–3.2, gain_retention 0.72. Chosen over the
  # numerically-highest 0.92 for margin from the calibration saturation gate (peak |Iopto|
  # @75mW ≈ 8.6 vs bound 10; 0.92 sits at 9.85). Swept as a plant axis.
  target_iopto: 0.8
  n_trials_sys_id: 100
  model_task_inputs: false
  # sys-ID opto excitation (sys_id_expts wildcards). stim_method selects the generator
  # (src.stim): oed = Fisher-information optimal (differential_evolution) pulsed-graded;
  # white = legacy white-lognormal×Bernoulli, duty tuned to the budget; chirp =
  # log-frequency sweep at the operating point.
  #   stim_u_max_mWmm2  = actuator amplitude cap (mW/mm²); light in [0, u_max].
  #   stim_budget_mWmm2 = mean-light budget = operating point (lower → more de-saturated).
  stim_method: oed
  stim_u_max_mWmm2: 75
  stim_budget_mWmm2: 6
  # opsin-NN training light distribution (src.opsin_stim; opsin_train_cold rule).
  # logwalk = log-uniform dwell + log-amplitude random walk (the default; one leaf spanning
  # both current_mix limits) | current_mix = 60% sustained blocks + 40% white lognormal (the
  # earlier validated default) | ou = single clipped Ornstein-Uhlenbeck colored-noise process.
  # Equivalent for control Q (sweep 10833292).
  opsin_stim_method: logwalk
  # USID model_fit-level loss-weight wildcards (route into usid_overrides via
  # src/scripts/model_fit.py): each maps to a usid_hyperparams.loss.loss_weights leaf.
  # Defaults match the static cold_usid.yaml values so a run that does not sweep them
  # carries the committed behaviour.
  usid_rollout: 0.1      # USID open-loop rollout loss weight (model_fit wildcard); 0.1 = committed default
  usid_teacher: 0.1       # USID teacher loss weight (model_fit wildcard); 0.1 = cold_usid default. 0 = drop teacher (clean tf-only with usid_rollout=0).
  usid_delta: 1.0         # USID delta-of-rollout loss weight (model_fit wildcard); 1.0 = cold_usid default. 0 = isolate the rollout-level axis (no delta-of-rollout conflation).
  behavior_weight: 1.0    # Behavior-block weight in the augmented [LFP|behavior] reconstruction losses (model_fit wildcard; routes into the natural Phase-1 and unnatural Phase-3 recons). 1.0 = equal LFP/behavior blocks. >1 upweights behavior reconstruction.
  fold_behavior: 1        # observer fold (model_fit wildcard): 1 = full-output (default; behavior folded into K1/K2 observer); 0 = LFP-only (K behavior cols pinned 0, behavior a pure readout).
  natural_restarts: 4     # natural-fit parallel multistart count (model_fit wildcard); 4 = successive-halving ensemble (default, the metric knee), rungs/rule from cold_usid.yaml. 1 = single fit.
  usid_restarts: 4        # unnatural-fit parallel multistart count (model_fit wildcard); the seed-lottery leg. Same scale as natural_restarts.
  val_regime: rollout_dom # validation-loss criterion (model_fit wildcard) for best-val checkpointing + multistart culling: rollout_dom {delta:0.2,rollout:1.0} (= cold_usid.yaml) | delta_dom {delta:1.0,rollout:0.2}.
  pool_row_len: 800       # USID opto-pool row length in samples (model_fit wildcard, 10 ms/sample). Rows are cut from the contiguous recording; capped at half the recording when it is shorter.
  a11_max_radius: 0.99    # natural A11 Schur clamp (model_fit wildcard); slowest retained natural mode.
  a22_max_radius: 0.97    # unnatural A22 Schur clamp (model_fit wildcard); under zero_k2 this is the block the controller free-runs.
  a_cl_lim: 0.99          # rail on rho(A_cl)=rho(A_open-K*C) (model_fit wildcard), enforced by the init shrink and training guard; 1.0 admits boundary-riding observers.
  ifp: 0.5                 # input-free penalty weight (training only)
  acf: 0.0                 # natural-leg output-ACF weight; the only term that reads A_open directly
  val_rollout_k: 80        # rollout horizon of the validation/selection score
  innov_white: 0.0         # natural-leg innovation-whiteness weight; 0.0 removes the term entirely
  kreg: 0.0                # natural-leg K1 L2 weight; 0.0 is inert (the term is not even computed)
  # Init-scale preset for the Jul-17 vs Jul-23 A/B: 'jul23' (shipped: K1/A12 at unit scale,
  # coupling and B' normalized by 1/sqrt of the summed dim) vs 'jul17' (flat 0.1), plus
  # jul17_{k1,a12,bprime,coupling} reverting one group at a time.
  init_scale: jul23
  # Closed-loop controller settings. NLMPC is the only controller valid on a with-opsin
  # arm (LQMPC plans linearly and over-drives light through the saturating opsin);
  # LQMPC remains valid for the no-opsin BRAID baseline.
  latency: false
  ctrl_type: NLMPC
  ctrl_horizon_ms: 100
  # Inner-solve iteration cap. The convergence test stops earlier when the projected
  # gradient flattens; the cap must be high enough that it is not what ends the solve.
  nlmpc_grad_iters: 300
  # Attribution objective. Every weight defaults to 0, so the objective is
  # tracking + effort exactly as before unless a sweep turns one on.
  alpha_attrib: 0.0        # commanded induced share of the required behavioral deviation
  Lambda_cost: 0.0         # weight on the commanded share (subspace LDS)
  Lambda_state: 0.0        # weight on ||x2||^2 -- the (d') mechanism constraint
  Lambda_nat: 0.0          # weight on the whitened natural deviation -- the (n') constraint
  Lambda_omega: 0.0        # weight on the atypicality-share setpoint (unified LDS)
  k: 32
  m: 32

# Top-level architectural switches
power_per_neuron_uW: 1
model_fit_method: "usid"
use_opsin: true
opsin_checkpoint_path: null
# Debugging override: pin one opsin checkpoint FILE (.../<timestamp>/best_model.pth) instead of
# letting model_fit hand USID the method dir, from which it takes the highest-sorting run.
# Null in every production run; set it only to re-fit a past era against current code.
opsin_checkpoint_pin: null
report_period_s: 60
train_device: cuda
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

# Rule-specific blocks (copied verbatim from previous config.yaml).
prep_fsnn:
  # this can't be changed without modifying task-loading code, as in reaching.py fout1
  dt_ms: 1
  # from Narayanan 2017
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231 # L2/3
    - 1.539 # L4
    - 1     # L5
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 20
  n_main_trials: 100
  n_settle_trials: 20
prep_fsnn_train:
  n_main_trials: 250
  n_settle_trials: 20
prep_fsnn_test:
  n_main_trials: 50

prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 800
  n_trials_pca: 100
  g: 3

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn
  opsin_calibration_dir: results/opsin_calibration

calibrate_opsin_plant:
  target_iopto: 0.8
  phim_scale: 5

# Hyperparams for the opsin_train_cold rule. See testconfig_params.yaml for
# details. Keep parity with testconfig unless production needs longer training.
opsin_train_cold:
  n_sequences: 500
  time_steps: 500
  sequence_length: 500
  epochs: 2000
  batch_size: 16
  lr: 3e-3
  hidden_size: 32
  num_layers: 2
  scheduler_patience: 200
  scheduler_factor: 0.8
  scheduler_min_lr: 1.0e-6
  seed: 42
  # Sustained on/off block light (opsin saturation-coverage fix, 2026-06-14). Trains
  # the NN on piecewise-constant ON blocks (amp ~U(0,sustain_amp_max), held for
  # sustain_steps) + sustained-zero OFF blocks, instead of pure-white lognormal.
  # Fixes the zero-light offset (off-blocks) and the high-light marginal-slope
  # over-statement (sustained-high blocks). The "high" variant (amp_max=75,
  # sustain<=160) is best on commanded light: dynamic R²(NN,biophysical 500um) 0.9993
  # vs white 0.9973, deep-saturation [50,75) bin 0.86->0.98. const_block_fraction=0
  # reproduces legacy all-white. See personal_notes cold_eval opsin_block_training doc.
  const_block_fraction: 0.6
  sustain_amp_max: 75
  sustain_steps_min: 40
  sustain_steps_max: 160
  off_steps_min: 10
  off_steps_max: 40
  block_on_probability: 0.5
  # ou method knobs (clipped Ornstein-Uhlenbeck colored noise; src.opsin_stim).
  # Only read when opsin_stim_method=ou; current_mix ignores them.
  ou_mu_mWmm2: 18.0
  ou_tau_ms: 120.0
  ou_std_mWmm2: 25.0

  # logwalk method knobs (src.opsin_stim). Only read when opsin_stim_method=logwalk.
  # Segment dwell is log-uniform on [1, dwell_max_steps], so this one leaf spans both of
  # current_mix's (dwell 1 = white, dwell ~160 = sustained block). reset_probability picks
  # a fresh log-uniform amplitude; otherwise the level is the previous one scaled by
  # exp(N(0, step_sigma)), which is what produces small steps away from a settled baseline.
  logwalk_amp_min_mWmm2: 0.1
  logwalk_amp_max_mWmm2: 75.0
  logwalk_dwell_max_steps: 160
  logwalk_reset_probability: 0.35
  logwalk_step_sigma: 0.5
  logwalk_off_probability: 0.25
model_fit:
  linear_Cz: true

model_fit_usid_stim_rec:
  # Placeholder block injected by Snakemake's step_cfg("model_fit", "usid_stim_rec")
  # lookup. These keys are NOT consumed by USID training.
  epochs: 2500
  steps_ahead_model_code: ""

expts:
  u_max_mWmm2: 75
  # Record per-neuron photocurrent + membrane voltage during control for the
  # realized opsin-saturation diagnostic (analyze_ctrl_data.per_neuron_saturation,
  # ctrl_perneuron_* columns). OFF by default: recording all neurons adds
  # multiple GB of Brian2 monitor RAM. Enable for a dedicated per-neuron-
  # saturation run (recorded on the subsampled grid to keep RAM bounded).
  record_opto_per_neuron: false

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 50

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  n_trials_ctrl: 100
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_step_size: 0.5
  # All stim-rec settings track Z, so this belongs to every setting rather than to
  # per-setting ctrl_expts_<setting> blocks.
  ref_type: Z

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

ctrl_expts_iLQR:
  ilqr_tol: 1e-4
  ilqr_mu_init: 1e-3
  ilqr_mu_min: 1e-6
  ilqr_mu_max: 1e6
  ilqr_mu_factor: 10.0

chr2_stability_check:
  # Verdict thresholds. ALL must hold for chr2_stable=True. Values are
  # generous for v1 — tighten after a single known-good cell completes
  # (rule of thumb: shrink each band by ~half once the nominal range
  # is empirically known).
  #
  # 0-light invariant. UnitlessChr2FourState resting Iopto is ~0 by
  # design; non-trivial leakage means broken plant wiring.
  iopto_max_abs_threshold: 0.01
  # Factor magnitude (rate-inflation proxy, mean(|X_chr2|)/mean(|y_bare|)).
  # At 0-light should sit ~1.0; opto inflation would push it > 1.
  factor_mag_ratio_min: 0.8
  factor_mag_ratio_max: 1.25
  # Z behavioral output magnitude shift.
  z_mean_ratio_min: 0.5
  z_mean_ratio_max: 2.0
  # Z divergence/saturation. Bare is subsampled to chr2's grid in the
  # analyzer so extreme-value statistics are sample-count-fair.
  z_max_ratio_max: 3.0

# (k, m) grid for the sweep, read by the Snakefile as config["q_usid"]. It lives here so a
# params-only invocation is legal; a sweeps file may override any of these keys.
#   channel_budget         total recorded channels; m = budget - k
#   num_stim_ratio_levels  how many k values to place across [1, budget-1]
#   target_k               optional filter to a single (k, m) pair
q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 7

# =============================================================================
# config_params.yaml — production COLD pipeline (params block).
#
# Single source of truth for parameter defaults + rule-specific config blocks.
# Sweep axes live in the companion config_sweeps.yaml; the cell budget is the
# full Cartesian product of those axes. Any axis not listed in sweeps falls
# back to its default below.
#
# Full-length quality-determining params (peer-validated reference that
# delivers fSNN R²(X)/R²(Z) ≈ 0.6-1.0 and supports the full v3 opsin pipeline):
#
#   block                                 keys                                  value(s)
#   ------------------------------------- ------------------------------------- -----------
#   prep_fsnn_demean                      n_init/n_main/n_settle                20 / 100 / 20
#   prep_fsnn_train                       n_main / n_settle                     250 / 20
#   prep_fsnn_test                        n_main                                50
#   prep_fsnn_reaching                    n_trials_pca                          100
#   natural_electrode_expts               n_trials_natural                      50
#   ctrl_expts                            n_trials_ctrl                         100
#   expts                                 u_max_mWmm2                           75
#   model_fit_usid_stim_rec               epochs                                2500
#
# Architectural switches (v3 pipeline wiring):
#   model_fit_method: usid
#   use_opsin: true
#   cleo_prep.opsin_plant_class: chr2_4s_fsnn
#   opsin_checkpoint_path: null  (use the opsin_train_cold checkpoint under
#                                 experiments/opsin_results_external/cold)
# =============================================================================

# Parameter defaults — used when a param is not present in the sweeps file.
# Every recognized condition param MUST have a default here.
params:
  task: reaching
  seed: 17230616
  n_latent_dims_offset: 0
  density_scale: 1
  network_area_scale: 1.44
  setting: usid_stim_rec
  beam_width_um: 100
  signals: lfp
  # Plant opto authority (cleo_prep-level cond-param): calibrate_opsin_plant target
  # photocurrent; g0 = target_iopto × 3.488, re-solved per value. 0.8 (g0 2.79) is the
  # mid-plateau operating point on the corrected cleo 0.19.0 plant: Q_track plateaus at
  # ~+0.40 (USID+oed +0.397 here) across g0 2.5–3.2, gain_retention 0.72. Chosen over the
  # numerically-highest 0.92 for margin from the calibration saturation gate (peak |Iopto|
  # @75mW ≈ 8.6 vs bound 10; 0.92 sits at 9.85). Swept as a plant axis.
  target_iopto: 0.8
  n_trials_sys_id: 100
  model_task_inputs: false
  # sys-ID opto excitation (sys_id_expts wildcards). stim_method selects the generator
  # (src.stim): oed = Fisher-information optimal (differential_evolution) pulsed-graded;
  # white = legacy white-lognormal×Bernoulli, duty tuned to the budget; chirp =
  # log-frequency sweep at the operating point.
  #   stim_u_max_mWmm2  = actuator amplitude cap (mW/mm²); light in [0, u_max].
  #   stim_budget_mWmm2 = mean-light budget = operating point (lower → more de-saturated).
  stim_method: oed
  stim_u_max_mWmm2: 75
  stim_budget_mWmm2: 6
  # opsin-NN training light distribution (src.opsin_stim; opsin_train_cold rule).
  # current_mix = 60% sustained blocks + 40% white lognormal (validated default) |
  # ou = single clipped Ornstein-Uhlenbeck colored-noise process. Equivalent for control
  # Q (sweep 10833292); ou is simpler, current_mix has better deep-saturation coverage.
  opsin_stim_method: current_mix
  # USID model_fit-level loss-weight wildcards (route into usid_overrides via
  # src/scripts/model_fit.py): forced = usid_hyperparams.loss.loss_weights.forced
  # (forced-loss weight). Defaults match the static cold_usid.yaml values so a run
  # that does not sweep them carries the committed behaviour.
  forced: 1.0
  usid_rollout: 0.1      # USID open-loop rollout loss weight (model_fit wildcard); 0.1 = committed default
  usid_teacher: 0.1       # USID teacher loss weight (model_fit wildcard; co-overrides loss_weights.teacher + schedule.teacher); 0.1 = cold_usid default. 0 = drop teacher (clean tf-only with forced=0, usid_rollout=0).
  usid_delta: 1.0         # USID delta-of-rollout loss weight (model_fit wildcard; plain leaf, NO schedule); 1.0 = cold_usid default. 0 = isolate the rollout-level axis (no delta-of-rollout conflation).
  behavior_weight: 1.0    # Behavior-block weight in the augmented [LFP|behavior] reconstruction losses (model_fit wildcard; routes into the natural Phase-1, B1' Phase-2, and unnatural Phase-3 recons). 1.0 = equal LFP/behavior blocks. >1 upweights behavior reconstruction.
  fold_behavior: 0        # observer fold (model_fit wildcard): 0 = LFP-only observer (default; K's behavior columns pinned 0, behavior a pure readout); 1 = behavior folded into the K1/K2 observer (full-output).
  latency: true
  ctrl_type: LQMPC
  ctrl_horizon_ms: 300
  nlmpc_grad_iters: 10
  k: 22
  m: 42

# Top-level architectural switches
power_per_neuron_uW: 1
model_fit_method: "usid"
use_opsin: true
opsin_checkpoint_path: null
report_period_s: 60
train_device: cuda
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

# Rule-specific blocks (copied verbatim from previous config.yaml).
prep_fsnn:
  # this can't be changed without modifying task-loading code, as in reaching.py fout1
  dt_ms: 1
  # from Narayanan 2017
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231 # L2/3
    - 1.539 # L4
    - 1     # L5
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 20
  n_main_trials: 100
  n_settle_trials: 20
prep_fsnn_train:
  n_main_trials: 250
  n_settle_trials: 20
prep_fsnn_test:
  n_main_trials: 50

prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 800
  n_trials_pca: 100
  g: 3

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn
  opsin_calibration_dir: results/opsin_calibration

calibrate_opsin_plant:
  target_iopto: 0.8
  phim_scale: 5

# Hyperparams for the opsin_train_cold rule. See testconfig_params.yaml for
# details. Keep parity with testconfig unless production needs longer training.
opsin_train_cold:
  n_sequences: 500
  time_steps: 500
  sequence_length: 250
  epochs: 5000
  batch_size: 16
  lr: 3e-3
  hidden_size: 32
  num_layers: 2
  scheduler_patience: 200
  scheduler_factor: 0.8
  scheduler_min_lr: 1.0e-6
  seed: 42
  # Sustained on/off block light (opsin saturation-coverage fix, 2026-06-14). Trains
  # the NN on piecewise-constant ON blocks (amp ~U(0,sustain_amp_max), held for
  # sustain_steps) + sustained-zero OFF blocks, instead of pure-white lognormal.
  # Fixes the zero-light offset (off-blocks) and the high-light marginal-slope
  # over-statement (sustained-high blocks). The "high" variant (amp_max=75,
  # sustain<=160) is best on commanded light: dynamic R²(NN,biophysical 500um) 0.9993
  # vs white 0.9973, deep-saturation [50,75) bin 0.86->0.98. const_block_fraction=0
  # reproduces legacy all-white. See personal_notes cold_eval opsin_block_training doc.
  const_block_fraction: 0.6
  sustain_amp_max: 75
  sustain_steps_min: 40
  sustain_steps_max: 160
  off_steps_min: 10
  off_steps_max: 40
  block_on_probability: 0.5
  # ou method knobs (clipped Ornstein-Uhlenbeck colored noise; src.opsin_stim).
  # Only read when opsin_stim_method=ou; current_mix ignores them.
  ou_mu_mWmm2: 18.0
  ou_tau_ms: 120.0
  ou_std_mWmm2: 25.0

model_fit:
  linear_Cz: true

model_fit_usid_stim_rec:
  # Placeholder block injected by Snakemake's step_cfg("model_fit", "usid_stim_rec")
  # lookup. These keys are NOT consumed by USID training.
  epochs: 2500
  steps_ahead_model_code: ""

expts:
  u_max_mWmm2: 75
  # Record per-neuron photocurrent + membrane voltage during control for the
  # realized opsin-saturation diagnostic (analyze_ctrl_data.per_neuron_saturation,
  # ctrl_perneuron_* columns). OFF by default: recording all neurons adds
  # multiple GB of Brian2 monitor RAM. Enable for a dedicated per-neuron-
  # saturation run (recorded on the subsampled grid to keep RAM bounded).
  record_opto_per_neuron: false

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 50

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  n_trials_ctrl: 100
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_step_size: 0.5

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

ctrl_expts_iLQR:
  ilqr_tol: 1e-4
  ilqr_mu_init: 1e-3
  ilqr_mu_min: 1e-6
  ilqr_mu_max: 1e6
  ilqr_mu_factor: 10.0

ctrl_expts_usid_stim_rec:
  ref_type: Z

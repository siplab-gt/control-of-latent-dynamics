# Swept axes for the testconfig pipeline. Every axis NOT listed here takes its default from
# config/testconfig_params.yaml. This file is the seed roster and nothing else: it fans the
# reference condition across seeds without varying anything about the condition itself.
#
# q_usid is NOT repeated here -- it lives in the params file, which is its single source of
# truth. A sweeps file may still override it when an experiment needs a different (k, m) grid.
#
# For a one-off experiment, copy this to tmp/<name>_sweeps.yaml and add axes there. Keep the
# `_sweeps` token in the filename so the rule-input blocklist skips it, or every cell re-runs
# when the file's mtime changes.

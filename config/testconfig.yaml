prep_fsnn_demean:
  n_init_trials: 5 # 50
  n_main_trials: 10 # 250
prep_fsnn_train:
  n_init_trials: 5
  n_main_trials: 15
  n_settle_trials: 5 # basically doing init trials for test here
prep_fsnn_test:
  n_main_trials: 10

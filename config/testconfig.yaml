# #####################################################################
# # parameters to sweep, constituting different experimental conditions
# #####################################################################
# NLMPC horizon/iterations sweep — focused on k=22/m=42, offset=-2
# Total ctrl_expts: 2 seeds × 1 k/m × (OL + LQMPC + 9 NLMPC) = 22 runs
# Upstream (prep_fsnn, cleo_prep, model_fit) reuses cached outputs.
#########################################
grid_sweep_params:
  seed:
    - 17230616
    - 18051223

# collapsed to reference values — not sweeping these for this run
#################################################################
star_sweep_params:
  n_trials_sys_id:
    - 10
  n_latent_dims_offset:
    - -2
  density_scale:
    - 1
  network_area_scale:
    - 1.44
  beam_width_um:
    - 100
  model_task_inputs:
    - false

star_sweep_params_measurement_only:
  signals:
    - lfp

# don't automatically sweep these, will be handled manually in Snakefile
########################################################################
manual_sweep_params:
  setting:
    - usid_stim_rec
  task:
    - reaching
  ctrl_type:
    - OL
    - LQMPC
    - NLMPC
  k: "depends on setting"
  m: "depends on setting"
  latency:
    - true
    - false
  ctrl_horizon_ms:
    - 100
    - 200
    - 300
  nlmpc_iters:
    - 2
    - 5
    - 10

#################
reference_params:
  n_trials_sys_id: 10
  n_latent_dims_offset: -2
  density_scale: 1
  network_area_scale: 1.44
  beam_width_um: 100
  latency: true
  model_task_inputs: false
  signals: lfp
  ctrl_horizon_ms: 300
  nlmpc_iters: 10

# question-specific parameters
##############################

q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 4
# #########################################
# # base parameters, used across conditions
# #########################################

# power_per_neuron_uW: 1 # when normalizing power

# # organized by step to easily group in Snakefile params statements
# ##################################################################

prep_fsnn:
  dt_ms: 1
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231
    - 1.539
    - 1
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 5 # 50
  n_main_trials: 10 # 250
  n_settle_trials: 5 # basically doing init trials for test here
prep_fsnn_train:
  n_main_trials: 15
  n_settle_trials: 5 # basically doing init trials for test here
prep_fsnn_test:
  n_main_trials: 10
# # task-specific
# prep_fsnn_cycling:
#   iti_min_s: 0
#   iti_lambda_s: 0
#   t_event_s: [0.5, 1.95]
#   muf: -0.5 # recurrent inhibtion
prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 200 # 800
  n_trials_pca: 20 # for rate network
  g: 3

model_fit_usid_stim_rec:
  epochs: 2500
  steps_ahead_model_code: ""

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  ctrl_horizon_ms: 300
  n_trials_ctrl: 5
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_iters: 10
  nlmpc_lr: 0.5

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

ctrl_expts_usid_stim_rec:
  ref_type: Z

# Base parameters
#################
power_per_neuron_uW: 1

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn  # v3 biophysical plant (UnitlessChr2FourState); NN opsin reused unchanged from USID-synthetic training.
  opsin_calibration_dir: results/opsin_calibration

model_fit:
  linear_Cz: true

# Model fit method selection
model_fit_method: "usid"
use_opsin: true
opsin_checkpoint_path: null


expts:
  u_max_mWmm2: 75

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 10

# Non-essential
report_period_s: 60
train_device: cuda  # requires module load cuda/12.1.1 for sm_70/V100 support
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

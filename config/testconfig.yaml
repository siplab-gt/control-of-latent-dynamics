# =============================================================================
# testconfig.yaml — full-length quality, low sweep.
#
# Role: what used to be called "lightweight-full". Same peer-validated
# full-length trial counts / epochs as config.yaml (fSNN R²(X)/R²(Z) ≈ 0.6-1.0
# aspiration per peer's plot; see `cold-evaluation` skill for caveats).
#
# Matches config.yaml on:
#   - prep_fsnn_* (20/100/20, 250/20, 50 trials)
#   - prep_fsnn_reaching.n_trials_pca (100)
#   - natural_electrode_expts.n_trials_natural (50)
#   - ctrl_expts.n_trials_ctrl (100)
#   - architectural switches (use_opsin: true, opsin_plant_class: chr2_4s_fsnn)
#   - calibrate_opsin_plant.target_iopto (0.05)
#
# DIVERGES from config.yaml on:
#   - prep_fsnn_reaching.n_rate_neurons: 200 (prod: 800). Known acknowledged
#     delta — testconfig uses a smaller rate network to keep prep_fsnn_train
#     tractable under reduced NN-training-trial counts. Not a full match.
#   - model_fit_usid_stim_rec.epochs: 2500 (placeholder, NOT consumed by USID;
#     see BRAID-legacy annotation on that block).
#
# Sweep trims (vs config.yaml full sweep):
#   - star_sweep_params.*: collapsed to reference values (1-element
#     lists); n_latent_dims_offset pinned to [0] (matched-capacity).
#     Restore [-2, 0] for production scientific comparisons.
#   - q_usid.num_stim_ratio_levels: 4 k/m pairs (prod: 7)
#   - ctrl_horizon_ms: pinned to 200 (center of [100, 200, 300]); sweep all
#     three in a follow-up run once baseline is established
#   - nlmpc_iters: pinned to 5 (center of [2, 5, 10]); sweep all three in a
#     follow-up run once baseline is established
#
# Matched to prod (after Apr 2026 chr2-fix baseline run):
#   - grid_sweep_params.seed: 5 seeds
#
# Preserved sweeps (matching config.yaml's manual_sweep_params philosophy —
# user-flagged as "always keep, tuning target"):
#   - ctrl_type: [OL, LQMPC, NLMPC]
#   - latency: [True, False]
#
# Cell count: 40 model_fit cells (5 seeds × 4 k/m × 2 offsets) and ~200
# ctrl_expts cells (40 OL + 80 LQMPC + 80 NLMPC). Wall clock at full-length
# with parallelism: ~4-8 hours typical, longer if GPU queue is saturated.
#
# For an even smaller smoke test with reduced full-length values, see
# ultra_light_config.yaml (does NOT produce usable fits — wiring check only).
# =============================================================================
#########################################
grid_sweep_params:
  seed:
    - 17230616
    - 18051223
    - 16320829
    - 18060520
    - 18220427

# collapsed to reference values — not sweeping these for this run
#################################################################
star_sweep_params:
  n_trials_sys_id:
    - 10
  # n_latent_dims_offset: number of state dims relative to fSNN's
  # ground-truth task-factor count (8 for testconfig reaching). offset=0
  # → n_x = 8 (matched capacity); offset=-2 → n_x = 6 (under-parameterized,
  # the more realistic "you don't know true rank" regime). Sweeping both
  # tests USID's robustness to misspecification but DOUBLES every
  # downstream cell from sys_id onward (~50% of pipeline cost). Single
  # value (=0) is fine for smoke-testing the pipeline; restore [-2, 0]
  # for production scientific runs that need the robustness story.
  n_latent_dims_offset:
    - 0
  density_scale:
    - 1
  network_area_scale:
    - 1.44
  beam_width_um:
    - 100
  model_task_inputs:
    - false

star_sweep_params_measurement_only:
  signals:
    - lfp

# don't automatically sweep these, will be handled manually in Snakefile
########################################################################
manual_sweep_params:
  setting:
    - usid_stim_rec
  task:
    - reaching
  ctrl_type:
    - OL
    - LQMPC
    - NLMPC
  k: "depends on setting"
  m: "depends on setting"
  latency:
    - true
    - false
  # Collapsed to center values for now to keep this baseline run focused on
  # validating the chr2 fix end-to-end. Sweep [100, 200, 300] for horizon
  # and [2, 5, 10] for nlmpc_iters in a follow-up run once the baseline is
  # established.
  ctrl_horizon_ms:
    - 200
  nlmpc_iters:
    - 5

#################
reference_params:
  n_trials_sys_id: 10
  n_latent_dims_offset: -2
  density_scale: 1
  network_area_scale: 1.44
  beam_width_um: 100
  latency: true
  model_task_inputs: false
  signals: lfp
  ctrl_horizon_ms: 300
  nlmpc_iters: 10

# question-specific parameters
##############################

q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 4
# #########################################
# # base parameters, used across conditions
# #########################################

# power_per_neuron_uW: 1 # when normalizing power

# # organized by step to easily group in Snakefile params statements
# ##################################################################

prep_fsnn:
  dt_ms: 1
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231
    - 1.539
    - 1
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 20
  n_main_trials: 100
  n_settle_trials: 20
prep_fsnn_train:
  n_main_trials: 250
  n_settle_trials: 20
prep_fsnn_test:
  n_main_trials: 50
# # task-specific
# prep_fsnn_cycling:
#   iti_min_s: 0
#   iti_lambda_s: 0
#   t_event_s: [0.5, 1.95]
#   muf: -0.5 # recurrent inhibtion
prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 200 # 800
  n_trials_pca: 100 # for rate network (full-length — matches config.yaml)
  g: 3

model_fit_usid_stim_rec:
  # Placeholder block injected by Snakemake's step_cfg("model_fit", "usid_stim_rec")
  # lookup. These keys are NOT consumed by USID training — USID reads epochs
  # from config/cold_usid.yaml (natural_hyperparams.epochs / usid_hyperparams.epochs).
  # `steps_ahead_model_code` is a BRAID-legacy field (src/model_fit/braid.py).
  # Kept here because step_cfg expects a dict; values are ignored for USID path.
  epochs: 2500
  steps_ahead_model_code: ""

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  ctrl_horizon_ms: 300
  n_trials_ctrl: 100  # full-length — matches config.yaml
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_iters: 10
  nlmpc_lr: 0.5

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

ctrl_expts_usid_stim_rec:
  ref_type: Z

# Base parameters
#################
power_per_neuron_uW: 1

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn  # v3 biophysical plant (UnitlessChr2FourState); NN opsin reused unchanged from USID-synthetic training.
  opsin_calibration_dir: results/opsin_calibration

calibrate_opsin_plant:
  # Required; no default. See config.yaml's block for rationale.
  # Consider raising to 0.10 once baseline is established (better control authority).
  target_iopto: 0.05

model_fit:
  linear_Cz: true

# Model fit method selection
model_fit_method: "usid"
use_opsin: true
opsin_checkpoint_path: null


expts:
  u_max_mWmm2: 75

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 50  # full-length — matches config.yaml

# Non-essential
report_period_s: 60
train_device: cuda  # requires module load cuda/12.1.1 for sm_70/V100 support
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

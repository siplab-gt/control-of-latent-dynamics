# #####################################################################
# # parameters to sweep, constituting different experimental conditions
# #####################################################################
# to automatically sweep all combinations
#########################################
grid_sweep_params:
  seed:
    - 17230616
    - 18051223
    # - 16320829
    # - 18060520
    # - 18220427

# exploratory vars to sweep one at a time in Q1, Q2
# i.e., explore space in star pattern
###################################################
star_sweep_params:
  n_trials_sys_id:
    - 10
    - 20
  # offset to number of PCs used to train fSNN, which is also used as ground-truth n_x
  n_latent_dims_offset:
    - -2
    - 0
  density_scale:
    - 1
    - 1.33
    # - 1.67
    # - 2
  network_area_scale: # proportional to array area
    - 1.44 # minimum for 0.4 mm padding around 4x4mm array, which we want for LFP
    - 2
    # - 3
  beam_width_um:
    # - 10
    # - 50
    - 100
    - 200
  model_task_inputs:
    - false
    - true

star_sweep_params_measurement_only:
  signals:
    - spikes
    - lfp
    # - both

# #################
reference_params:
  #   ###############
  n_trials_sys_id: 20 # TODO
  # n_latent_dims_offset: 0
  # density_scale: 1
  # network_area_scale: 1.44
  # beam_width_um: 100
  # latency: true
  # model_task_inputs: true
  signals: lfp

# question-specific parameters
##############################

q1: # a.k.a. sufficient stim, how many channels are good enough?
  ##############################################################
  sufficient_ctrl: 0.9
  k:
    - 1
    # - 2
    # - 4
    - 8
    # - 16
    - 32
    - 64
  m: NA

q2: # a.k.a. optimal stim/rec balance
  ###################################
  channel_budget: 64
  num_stim_ratio_levels: 4 # instead of 7
# #########################################
# # base parameters, used across conditions
# #########################################

# power_per_neuron_uW: 1 # when normalizing power


# #####################################################################
# # Ultra-light config: absolute bare minimum that still exercises every
# # stage of the COLD pipeline end-to-end (prep_fsnn → cleo_prep →
# # sys_id_expts + natural_electrode_expts → model_fit → ctrl_expts →
# # tabulate → figures). Target wall-clock <10 min (modulo SLURM queue).
# #
# # Reductions vs testconfig.yaml:
# #   - 1 seed (was 2)
# #   - 1 k/m pair via num_stim_ratio_levels=1 (was 4)
# #   - 1 ctrl_horizon_ms and 1 nlmpc_iters (was 3×3=9 NLMPC combos)
# #   - prep_fsnn_{demean,train,test} trial counts cut to minimum
# #   - n_trials_sys_id=5, n_trials_natural=3, n_trials_ctrl=2
# #   - usid_overrides drops natural + USID training to 2 epochs each
# #     (bypasses whatever grid built snake/build/usid_model.merged.yaml)
# #####################################################################

grid_sweep_params:
  seed:
    - 17230616

star_sweep_params:
  n_trials_sys_id:
    - 5
  n_latent_dims_offset:
    - -2
  density_scale:
    - 1
  network_area_scale:
    - 1.44
  beam_width_um:
    - 100
  model_task_inputs:
    - false

star_sweep_params_measurement_only:
  signals:
    - lfp

manual_sweep_params:
  setting:
    - usid_stim_rec
  task:
    - reaching
  ctrl_type:
    - OL
    - LQMPC
    - NLMPC
  k: "depends on setting"
  m: "depends on setting"
  latency:
    - true
    - false
  ctrl_horizon_ms:
    - 300
  nlmpc_iters:
    - 2

reference_params:
  n_trials_sys_id: 5
  n_latent_dims_offset: -2
  density_scale: 1
  network_area_scale: 1.44
  beam_width_um: 100
  latency: true
  model_task_inputs: false
  signals: lfp
  ctrl_horizon_ms: 300
  nlmpc_iters: 2

q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 1

# #########################################
# # base parameters, used across conditions
# #########################################

prep_fsnn:
  dt_ms: 1
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231
    - 1.539
    - 1
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 2
  n_main_trials: 3
  n_settle_trials: 1
prep_fsnn_train:
  n_main_trials: 2
  n_settle_trials: 1
prep_fsnn_test:
  n_main_trials: 3

prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 200
  n_trials_pca: 20
  g: 3

model_fit_usid_stim_rec:
  foo: bar

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  ctrl_horizon_ms: 300
  n_trials_ctrl: 2
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_iters: 2
  nlmpc_lr: 0.5

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

ctrl_expts_usid_stim_rec:
  ref_type: Z

power_per_neuron_uW: 1

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn
  opsin_calibration_dir: results/opsin_calibration

model_fit:
  linear_Cz: true

model_fit_method: "usid"
use_opsin: true
opsin_checkpoint_path: null

# Deep-merged onto the USID merged config by src/model_fit/usid.py.
# Rollout K/W intentionally NOT overridden (fragile — tied to window_seq_len).
usid_overrides:
  natural_hyperparams:
    epochs: 2
  usid_hyperparams:
    epochs: 2

expts:
  u_max_mWmm2: 75

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 3

report_period_s: 60
train_device: cuda
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

#####################################################################
# parameters to sweep, constituting different experimental conditions
#####################################################################

# to automatically sweep all combinations
#########################################
grid_sweep_params:
  seed:
    - 17230616
    - 18051223
    - 16320829
    # - 18060520
    # - 18220427

# exploratory vars to sweep one at a time in Q1, Q2
# i.e., explore space in star pattern
###################################################
star_sweep_params:
  n_trials_sys_id:
    # - 10
    # - 50
    # - 100
    - 12
    - 14
  latent_dim: # only possible on integration?
    - 1
    # - 2
    # - 4
    # - 8
    - 16
  total_scale:
    - 0.1
    # - 1
    - 10
  network_area_scale: # proportional to array area
    - 1
    # - 2
    # - 3
    - 4
  beam_width_um:
    - 10
    # - 50
    # - 100
    - 200
  beam_spacing:
    - 0.5
    - 1
    - 2
    - 5
    - 10
  connection_distance_penalty:
    - 0
    # - 0.001
    # - 0.01
    - 0.1
  connection_l2_penalty:
    - 0
    # - 0.001
    # - 0.01
    - 0.1
  # keep the same L4-L2/3-L5 structure everywhere, but alter weights
  # single "layeredness" variable that controls both layer connectivity penalty
  # and density variation by layer
  layeredness:
    - 0
    # - 0.33
    # - 0.67
    - 1
  dales_law:
    - false
    - true
  n_pcs:
    - 1
    # - 5
    - 10
    # - 15
    - 20
  model_task_inputs:
    - false
    - true

# don't automatically sweep these, will be handled manually in Snakefile
########################################################################
manual_sweep_params:
  setting:
    - sufficient_stim
    - optimal_stim_rec
  task:
    # - cycling
    - reaching
    # - integration
  ctrl_type:
    - OL
    - LQMPC
  k: "depends on setting"
  m: "depends on setting"
  latency:
    - true
    - false

#################
reference_params:
  ###############
  # n_trials_sys_id: 50
  n_trials_sys_id: 12 # TODO
  latent_dim: 2
  total_scale: 1
  network_area_scale: 2
  beam_width_um: 100
  beam_spacing: 2
  connection_distance_penalty: 0.5
  connection_l2_penalty: 0
  layeredness: 0
  dales_law: false
  latency: true
  n_pcs: 20
  model_task_inputs: true

##############################
# question-specific parameters
##############################

q1: # a.k.a. sufficient stim, how many channels are good enough?
  ##############################################################
  sufficient_ctrl: 0.9
  k:
    - 1
    - 2
    # - 4
    - 8
    # - 16
    # - 32
    - 64
  m: NA

q2: # a.k.a. optimal stim/rec balance
  ###################################
  channel_budget: 64
  # num_stim_ratio_levels: 7
  num_stim_ratio_levels: 4 # TODO

q3: # how do results change with increasing realism?
  ##################################################
  # maybe don't need to hardcode this in? could interpolate
  # realism_levels:
  #   0: reference
  #   1:
  #     latent_dim: 4
  #     network_size_um: 2000
  #     connection_distance_penalty: 1
  #     connection_layer_penalty: 1
  #     num_tasks: 1
  #     # dale's law
  #   2:
  #     total_scale: 1
  #     network_size_um: 1000
  #     beam_width_um: 100
  #     beam_spacing: 2
  #     connection_distance_penalty: 0
  #     connection_l2_penalty: 0
  #     stim_channels: 0.5

  # interpolate from least to most realistic setting for each feature
  # from the one-at-a-time sweeps
  num_realism_levels: 10
  realism_features:
    - latent_dim
    - network_size_um # or total_scale?
    - connection_distance_penalty
    - connection_layer_penalty
    # TODO: num_tasks
    # - num_tasks
    - dales_law

#########################################
# base parameters, used across conditions
#########################################

power_per_neuron_uW: 1 # when normalizing power

# organized by step to easily group in Snakefile params statements
##################################################################

train_fsnn:
  device: cuda # cpu or cuda
  dt_ms: 1
  # from Narayanan 2017:
  # L5 is the sparsest, serves as base.
  base_neuron_density: 650 # neurons per mm^3. 65k is realistic
  layer_density_ratios:
    - 1.231 # L2/3, =80/65
    - 1.539 # L4, =100/65
    - 1 # L5
  layer_boundaries_um:
    - 150 # L2/3 start
    - 550 # L4 start
    - 900 # L5 start
    - 1450 # L5 end
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1 # TODO
  n_trials_demean: 300
  n_trials_train: 300
  n_trials_test: 100
  task_specific:
    cycling:
      iti_min_s: 0
      iti_lambda_s: 0
      t_event_s: [0.5, 1.95]
      n_conds: 1
    reaching:
      iti_min_s: .4
      iti_lambda_s: 2
      t_event_s: [0.35, 0.15, 0.31]
      n_rate_net_neurons: 800
      n_conds: 8

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8

model_fit:
  device: cpu # TODO: switch to gpu
  # task_specific:  # ???
  #   reaching:
  #     n_x1: 3
  #     epochs: 100

expts: # common to sys ID and ctrl expts
  u_max_mWmm2: 75
  sample_period_ms: 1

sys_id_expts:
  foo: bar

ctrl_expts:
  Q_cost: 1
  R_cost: 0.1
  # ctrl_horizon_ms: 50
  ctrl_horizon_ms: 20
  # pred_horizon_ms: 100
  # n_trials_ctrl: 100
  n_trials_ctrl: 12
  baseline_latency_ms: 1

# non-essential stuff, don't need to pass in as params
######################################################
# for brian report printing frequency
report_period_s: 50

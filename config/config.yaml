#####################################################################
# parameters to sweep, constituting different experimental conditions
#####################################################################

# to automatically sweep all combinations
#########################################
grid_sweep_params:
  seed:
    - 16320829
    - 16890118
    - 17230616
    - 18051223
    - 18060520
    - 18220427
    - 18990508
    - 19120731

# exploratory vars to sweep one at a time in Q1, Q2
# i.e., explore space in star pattern
###################################################
star_sweep_params:
  n_trials_sys_id:
    - 1
    - 2
    - 5
    - 10
    - 50
    - 100
  # offset to number of PCs used to train fSNN, which is also used as ground-truth n_x
  n_latent_dims_offset:
    - -2
    - -1
    - 0
    - 1
    - 5
    - 10
  density_scale:
    - 1
    - 1.33
    - 1.67
    - 2
  model_task_inputs:
    - false
    - true

star_sweep_params_sufficient_stim:
  network_area_scale:
    # proportional to array area
    - 1.06348 # provides padding of just the pitch for 32x32 array
    - 2
    - 3
  beam_width_um:
    - 5
    - 35
    - 65
    - 95
    - 125

star_sweep_params_optimal_stim_rec:
  network_area_scale:
    # proportional to array area
    - 1.44 # minimum for 0.4 mm padding around 4x4mm array, which we want for LFP
    - 2
    - 3
  beam_width_um:
    - 10
    - 50
    - 100
    - 200
    - 400
  signals:
    - spikes
    - lfp
    - both

# don't automatically sweep these, will be handled manually in Snakefile
########################################################################
manual_sweep_params:
  setting:
    - sufficient_stim
    - optimal_stim_rec
  task:
    # - cycling
    - reaching
    # - integration
  ctrl_type:
    - OL
    - LQMPC
  k: "depends on setting"
  m: "depends on setting"
  latency:
    - true
    - false

#################
reference_params:
  ###############
  n_trials_sys_id: 100
  n_latent_dims_offset: 0
  density_scale: 1
  latency: false
  model_task_inputs: true

reference_params_sufficient_stim:
  network_area_scale: 1.06348 # provides padding of just the pitch for 32x32 array
  beam_width_um: 35

reference_params_optimal_stim_rec:
  network_area_scale: 1.44
  beam_width_um: 100
  signals: lfp

##############################
# question-specific parameters
##############################

q1:
  # a.k.a. sufficient stim, how many channels are good enough?
  ##############################################################
  sufficient_ctrl: 0.9
  k:
    - 1
    - 2
    - 5
    - 10
    - 20
    - 30
    - 40
    - 50
    - 60
    - 80
    - 100
    - 200
    - 400
    - 700
    - 1024
  m: NA

q2:
  # a.k.a. optimal stim/rec balance
  ###################################
  channel_budget: 100
  num_stim_ratio_levels: 11

#########################################
# base parameters, used across conditions
#########################################

power_per_neuron_uW: 1 # when normalizing power

# organized by step to easily group in Snakefile params statements
##################################################################

prep_fsnn:
  # ⚠️ this can't be changed without modifying task-loading code, as in reaching.py fout1
  dt_ms: 1
  # from Narayanan 2017:
  # L5 is the sparsest, serves as base.
  # in reference density/area configuration. 1024 to match max channels in Q1
  n_neurons_base: 1024
  # so that the base condition in Q1 has exactly 1024 neurons
  network_area_scale_base: 1.06348
  layer_density_ratios:
    - 1.231 # L2/3, =80/65
    - 1.539 # L4, =100/65
    - 1 # L5
  layer_boundaries_um:
    - 150 # L2/3 start
    - 550 # L4 start
    - 900 # L5 start
    - 1450 # L5 end

  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0

  dtrls: 2 # average number of steps between RLS updates
  # decay time constants
  tau_v_ms: 10 # membrane voltage
  tau_s_ms: 100 # slow synaptic currents
  tau_f_ms: 5 # fast synaptic currents
  vth: 1e-16 # spike threshold
  vr: -10 # reset voltage
  g: 6 # feedback gain. more like input gain?
  muf: -0.3 # recurrent inhibtion
  gs: 0.11 # gain of slow random synapses
  gf: 0.13 # gain of fast random synapses
  default_float_dtype: float32

# mode-specific
prep_fsnn_demean:
  n_init_trials: 20 # 50
  n_main_trials: 100 # 250
  n_settle_trials: 20 # basically doing init trials for train here
prep_fsnn_train:
  n_main_trials: 250
  n_settle_trials: 20 # basically doing init trials for test here
prep_fsnn_test:
  n_main_trials: 50

# task-specific
prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [ 0.5, 1.95 ]
  muf: -0.5 # recurrent inhibtion
prep_fsnn_reaching:
  iti_min_s: 0.4
  iti_lambda_s: 2
  t_event_s: [ 0.35, 0.15, 0.31 ]
  n_rate_neurons: 800 # 800
  n_trials_pca: 100 # for rate network
  g: 3 # feedback gain. more like input gain?

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 10
  typical_Irr0_mWmm2: 5
  # needed early for LFP
  subsample_factor: 10 # ctrl/sample period relative to fsnn dt

cleo_prep_sufficient_stim:
  array_n_per_side: 32

model_fit:
  linear_Cz: true

model_fit_sufficient_stim:
  foo: bar
  # task_specific:  # ???
  #   reaching:
  #     n_x1: 3
  #     epochs: 100

model_fit_optimal_stim_rec:
  epochs: 2500 # only needed here for braid
  # as explained in BRAID tutorial, this makes U observable when forecasting and programs steps_ahead=[1, 10]
  # steps_ahead_model_code: "ObsUKfw_ObsUCfw_sta1;9;10"
  steps_ahead_model_code: ""

expts:
  # common to sys ID and ctrl expts
  u_max_mWmm2: 75

sys_id_expts:
  foo: bar

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  ctrl_horizon_ms: 300
  n_trials_ctrl: 100
  baseline_latency_ms: 1 # bare minimum, e.g., for I/O
  solvers: [ "osqp", "clarabel", "scs" ]
  # solver_args:
  # need to define these below since recursive dict merging isn't
  # implemented when we load params in Snakefile

ctrl_expts_OL:
  time_limit_ms: 2000 # representative of inter-trial interval for reaching
  solver_args:
    max_iter: 1e+8 # very high since we want to rely on time limit
    eps_infeas: 1e-8 # smaller is less sensitive
    # derived from above, subtracting baseline and overhead
    # time_limit: 2
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e+8 # very high since we want to rely on time limit
    eps_infeas: 1e-8 # smaller is less sensitive
    # derived from above, subtracting baseline and overhead
    # time_limit: 0.02
    warm_start: true
    enforce_dpp: true

ctrl_expts_sufficient_stim:
  ref_type: X # controlling ground-truth factors

ctrl_expts_optimal_stim_rec:
  ref_type: Z # controlling output

analysis_sufficient_stim:
  ctrl_metric: Q_track_Xref_Xhat_lds
  # ctrl_metric: Q_track_Xref_X_fsnn
  key_metrics:
    - "k_knee"
    - "k_0.9"

analysis_optimal_stim_rec:
  ctrl_metric: Q_track_Zref_Z
  key_metrics:
    - optimal_alpha_stim
    - alpha_centroid

dependence_analysis:
  n_shuffle_boot: 1000
  significance_threshold: 0.05
  estimator_type: kernel

# non-essential stuff, don't need to pass in as params to trigger re-runs when changed
######################################################################################
report_period_s: 60 # for brian report printing frequency
train_device: cuda # cuda or cython
model_fit_device: gpu # cpu or gpu
log_level: DEBUG # DEBUG, INFO, WARNING, ERROR, CRITICAL
auto_plot: true # automatically plot data from individual experiments
# wait for debugger attach. also save/plot extra data (e.g., from fSNN training)
debug: false

# =============================================================================
# testconfig_sweeps_g0resweep.yaml — g0 (opto-authority) re-sweep at the CURRENT
# model config (USID dims=8 in cold_usid.yaml, NLMPC with the L-BFGS-B solver).
#
# Purpose: re-verify, at the current config, the g0 inverted-U found in the
# dims=4 / pre-L-BFGS-B authority sweep (Jun 1-2). g0 is set by target_iopto
# (g0 re-solved per calibration so steady-state Iopto at 5 mW == target_iopto).
# The wrapper run_g0_resweep.sbatch seds target_iopto and phim_scale per combo
# and recalibrates each. Combos: target_iopto {0.02, 0.0575, 0.15} x phim {5,60}.
#   - phim=60 (de-saturated, lin[5,75]~0.91): expect an inverted-U in Q with the
#     peak near the production target_iopto=0.0575 -> confirms g0 is well tuned.
#   - phim=5  (saturating edge, lin[5,75]=0.487): expect no g0 rescues USID+opsin
#     control -> confirms the saturating-plant wall is a nonlinearity-shape issue,
#     not a g0/authority range issue.
#
# Two settings: usid_stim_rec (USID+opsin, experimental arm) and braid_stim_rec
# (no opsin, linear control baseline — the clean inverted-U read). NLMPC only
# (the valid opsin-in-loop controller; NULL auto-added as the Q_track baseline).
# NLMPC-on-BRAID is linear (no opsin), so braid_stim_rec is the linear reference.
# 5 seeds (same set as the dims8/satedge sweeps), k=m=32, nlmpc_grad_iters=300.
# =============================================================================

sweeps:
  seed:
    - 17230616
    - 18051223
    - 16320829
    - 18060520
    - 18220427
  ctrl_type:
    - NLMPC
  setting:
    - usid_stim_rec
    - braid_stim_rec
  nlmpc_grad_iters:
    - 300
  n_trials_sys_id:
    - 50

q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 3
  target_k: 32

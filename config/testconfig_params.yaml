# =============================================================================
# testconfig_params.yaml — full-length quality, low sweep (params block).
#
# Single source of truth for parameter defaults + rule-specific config blocks.
# The companion testconfig_sweeps.yaml contains the explicit Cartesian-product
# sweep axes; any axis not listed there falls back to its default below.
#
# Role: what used to be called "lightweight-full". Same peer-validated
# full-length trial counts / epochs as config.yaml.
#
# Matches config.yaml on:
#   - prep_fsnn_* (20/100/20, 250/20, 50 trials)
#   - prep_fsnn_reaching.n_trials_pca (100)
#   - natural_electrode_expts.n_trials_natural (50)
#   - ctrl_expts.n_trials_ctrl (100)
#   - architectural switches (use_opsin: true, opsin_plant_class: chr2_4s_fsnn)
#   - calibrate_opsin_plant.target_iopto (0.05)
#
# DIVERGES from config.yaml on:
#   - prep_fsnn_reaching.n_rate_neurons: 200 (prod: 800).
#   - model_fit_usid_stim_rec.epochs: 2500 (placeholder, NOT consumed by USID).
# =============================================================================

# Parameter defaults — used when a param is not present in the sweeps file.
# Every recognized condition param MUST have a default here.
params:
  task: reaching
  seed: 17230616
  n_latent_dims_offset: 0
  density_scale: 1
  network_area_scale: 1.44
  setting: usid_stim_rec
  beam_width_um: 100
  signals: lfp
  n_trials_sys_id: 50
  model_task_inputs: false
  # USID model_fit-level wildcards (route into usid_overrides via
  # src/scripts/model_fit.py): forced = usid_hyperparams.loss.loss_weights.forced
  # (forced-loss weight), pin_bprime = usid_hyperparams.pin_bprime (int 0/1, NOT
  # bool — Snakemake wildcards are strings and bool("0") is True). Defaults match
  # the static cold_usid.yaml values (forced 1.0, pin_bprime off) so a run that
  # does not sweep them carries the committed behaviour.
  forced: 1.0
  pin_bprime: 0
  usid_rollout: 0.1      # USID open-loop rollout loss weight (model_fit wildcard); 0.1 = committed default
  opsin_sustain: default  # cold-opsin variant: default (rule) | moderate | high (pre-staged, pinned via opsin_checkpoint_path)
  n_restarts: 1           # USID multistart count (model_fit wildcard); 1 = single fit (no multistart), committed default
  latency: false
  ctrl_type: LQMPC
  ctrl_horizon_ms: 200
  nlmpc_grad_iters: 5
  k: 22
  m: 42

# Top-level architectural switches.
# `model_fit_method` and `use_opsin` are intentionally NOT defaulted here:
# every setting in this run's sweep specifies them via its own
# model_fit_<setting> overlay, so a top-level value would be dead. (They
# remain top-level in production configs that don't sweep `setting`.)
power_per_neuron_uW: 1
opsin_checkpoint_path: null
report_period_s: 60
train_device: cuda
model_fit_device: gpu
log_level: DEBUG
auto_plot: true
debug: false

# Rule-specific blocks (copied verbatim from previous testconfig.yaml).
prep_fsnn:
  dt_ms: 1
  base_neuron_density: 125
  layer_density_ratios:
    - 1.231
    - 1.539
    - 1
  layer_boundaries_um:
    - 150
    - 550
    - 900
    - 1450
  connection_distance_penalty_max: 1
  connection_layer_penalty_max: 0.1
  n_init_trials: 0
  n_main_trials: 0
  n_settle_trials: 0
  dtrls: 2
  tau_v_ms: 10
  tau_s_ms: 100
  tau_f_ms: 5
  vth: 1e-16
  vr: -10
  g: 6
  muf: -0.3
  gs: 0.11
  gf: 0.13
  default_float_dtype: float32

prep_fsnn_demean:
  n_init_trials: 20
  n_main_trials: 100
  n_settle_trials: 20
prep_fsnn_train:
  n_main_trials: 250
  n_settle_trials: 20
prep_fsnn_test:
  n_main_trials: 50

prep_fsnn_cycling:
  iti_min_s: 0
  iti_lambda_s: 0
  t_event_s: [0.5, 1.95]
  muf: -0.5

prep_fsnn_reaching:
  iti_min_s: .4
  iti_lambda_s: 2
  t_event_s: [0.35, 0.15, 0.31]
  n_rate_neurons: 200
  n_trials_pca: 100
  g: 3

model_fit_usid_stim_rec:
  # Placeholder block injected by Snakemake's step_cfg("model_fit", "usid_stim_rec")
  # lookup. These keys are NOT consumed by USID training — USID reads epochs
  # from config/cold_usid.yaml.
  epochs: 2500
  steps_ahead_model_code: ""
  # Per-setting overrides (consumed by src/scripts/model_fit.py overlay
  # injection — keys here clobber the matching top-level config_dict entries
  # before fit_lds_to_data is called).
  model_fit_method: usid
  use_opsin: true

model_fit_usid_stim_rec_no_opsin:
  # USID with the NN opsin disabled. B' is trained against z-scored light
  # directly; LDS recurrence stays subspace (A11/A22/K1/K2/Cz1/Cz2). No
  # natural-electrode handoff overhead change vs usid_stim_rec.
  epochs: 2500
  steps_ahead_model_code: ""
  model_fit_method: usid
  use_opsin: false

model_fit_braid_stim_rec:
  # BRAID method: unified A/B_opto/Cz, no subspace, no opsin. The Snakefile's
  # get_usid_dependencies / get_natural_data_input dispatch returns []
  # because _resolve_model_fit_method(braid_stim_rec) → "braid", so no
  # natural electrode data is consumed.
  model_fit_method: braid
  use_opsin: false
  # BRAID-specific hyperparams consumed in src/model_fit/braid.py:
  #   line 39: methodCode = f"BRAID_{Cz_code}_{steps_ahead_model_code}"
  #   line 43: args["epochs"] = epochs
  # 200 mirrors the natural-model training budget in cold_usid.yaml; the
  # only on-record working BRAID baseline (commit 1179c0a) used 100. Earlier
  # 2500 was a copy from the dead `model_fit_usid_stim_rec.epochs` placeholder
  # and likely caused overfitting (in-sample R² 0.96 vs forced-response −2.33
  # per math-forensics agent on 2026-05-03).
  epochs: 200
  steps_ahead_model_code: ""

model_fit_braid_stim_rec_nonlinear:
  # BRAID with nonlinear Cz MLP. Iteration log:
  #   Sweep 6  Cz1HL64U  no stability:  R²(Z)=0.915, NLMPC Q=-0.022, iLQR Q=-0.009
  #   Sweep 7  Cz1HL16U  + |λ|≤0.97:    R²(Z)=0.821, NLMPC Q=-0.041, iLQR Q=-0.030  (BOTH changes hurt)
  #   Sweep 8  Cz1HL64U  + |λ|≤0.97:    isolating stability projection's effect (this row)
  # Knobs driven by the Sweep 6 forensic analysis (scratch notes, not committed).
  model_fit_method: braid
  use_opsin: false
  linear_Cz: false
  cz_hidden_units: 64
  epochs: 200
  steps_ahead_model_code: ""

# === Loss-recovery sweep (2026-05-30) — 4 USID/no-opsin settings ===
# Tests whether constraining the FREE-RUN (rollout) and/or matching the output
# autocorrelation (ACF, which constrains the natural A11 directly) recovers the
# open-loop rollout R2(Z) the controller plans against — currently decoupled from
# the (good) 1-step teacher-forced R2(Z). Per-setting `usid_overrides` reach
# usid.py via the model_fit overlay (model_fit.py:186-202) and deep-merge onto
# cold_usid.yaml (usid.py:357-359). ACF is natural-phase-only (A11 is frozen in
# the USID phase). NOTE: `schedule` overrides static loss_weights, and a
# linear schedule with `end` PERSISTS after its window — so raising rollout needs
# its schedule overridden too (else the stock 0.1->0.1 linear schedule pins it
# back to 0.1). Verify activation post-run via natural_metrics.json train_components.
model_fit_usid_loss_base:        # L0 baseline (cold_usid.yaml defaults)
  model_fit_method: usid
  use_opsin: false
  epochs: 2500
  steps_ahead_model_code: ""

model_fit_usid_loss_roll:        # L1 rollout weight 0.1 -> 1.0 (both phases)
  model_fit_method: usid
  use_opsin: false
  epochs: 2500
  steps_ahead_model_code: ""
  usid_overrides:
    natural_hyperparams:
      loss:
        loss_weights: {rollout: 1.0}
        schedule:
          rollout: {mode: linear, start: 1.0, end: 1.0, epochs: 20}
    usid_hyperparams:
      loss:
        loss_weights: {rollout: 1.0}
        schedule:
          rollout: {mode: linear, start: 1.0, end: 1.0, epochs: 20}

model_fit_usid_loss_acf:         # L2 ACF loss 0.0 -> 1.0 (natural phase; constrains A11)
  model_fit_method: usid
  use_opsin: false
  epochs: 2500
  steps_ahead_model_code: ""
  usid_overrides:
    natural_hyperparams:
      loss:
        loss_weights: {acf: 1.0}
        schedule:
          acf: {mode: linear, start: 1.0, end: 1.0, epochs: 20}

model_fit_usid_loss_both:        # L3 rollout=1.0 + acf=1.0
  model_fit_method: usid
  use_opsin: false
  epochs: 2500
  steps_ahead_model_code: ""
  usid_overrides:
    natural_hyperparams:
      loss:
        loss_weights: {rollout: 1.0, acf: 1.0}
        schedule:
          rollout: {mode: linear, start: 1.0, end: 1.0, epochs: 20}
          acf: {mode: linear, start: 1.0, end: 1.0, epochs: 20}
    usid_hyperparams:
      loss:
        loss_weights: {rollout: 1.0}
        schedule:
          rollout: {mode: linear, start: 1.0, end: 1.0, epochs: 20}

ctrl_expts:
  Q_cost: 1
  R_cost: 1e-3
  n_trials_ctrl: 100
  baseline_latency_ms: 1
  solvers: ["osqp", "clarabel", "scs"]
  nlmpc_step_size: 0.5
  # All current stim-rec settings track Z; was previously specified per-setting
  # in identical ctrl_expts_<setting>.ref_type: Z blocks.
  ref_type: Z

ctrl_expts_OL:
  time_limit_ms: 2000
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    verbose: true
    ignore_dpp: true

ctrl_expts_LQMPC:
  time_limit_ms: 20
  solver_args:
    max_iter: 1e8
    eps_infeas: 1e-8
    warm_start: true
    enforce_dpp: true

ctrl_expts_NLMPC: {}

# iLQR-specific overrides (all optional — class defaults apply otherwise).
# `ilqr_max_iters` is read from the `nlmpc_grad_iters` wildcard so iLQR
# can share NLMPC's path encoding without adding a new wildcard.
ctrl_expts_iLQR:
  ilqr_tol: 1e-4
  ilqr_mu_init: 1e-3
  ilqr_mu_min: 1e-6
  ilqr_mu_max: 1e6
  ilqr_mu_factor: 10.0

cleo_prep:
  array_side_length_mm: 4
  array_n_per_side: 8
  typical_Irr0_mWmm2: 5
  subsample_factor: 10
  opsin_plant_class: chr2_4s_fsnn
  opsin_calibration_dir: results/opsin_calibration

calibrate_opsin_plant:
  # RE-ANCHORED (2026-06-01 authority sweep). The legacy 0.05@100µm operating
  # point ran opto at ~1/11.5 of the natural task-input scale mean(|u_in|)≈0.575
  # — and the working proportional_current plant tunes opto TO mean(|u_in|) at a
  # 500µm reference (cleo_prep.py). So we re-anchor: fiber reference distance to
  # 500µm (raises solved g0 ~3.4×) and target_iopto toward mean(|u_in|).
  # target_iopto + phim_scale are SWEPT by tmp/cold_ablation/run_authority_sweep.sbatch
  # (these base values are placeholders the wrapper sed-overwrites per combo).
  target_iopto: 0.0575
  phim_scale: 1
  # Reference fiber→neuron distance for the g0 solve (lines up with the
  # proportional_current plant's 0.5 mm reference).
  fiber_distance_um: 500
  # E (reversal potential) and the g0 clamp anchor to the RESTING (no-input)
  # v-distribution (vinf absent task input, median over neurons). e_ratio sets E
  # placement: E = v_low + e_ratio*window; lower = E closer = stronger (V−E) dependence.
  e_ratio: 3.5
  # Guard RELAXED to 10.0: at target≈mean(|u_in|) the OPERATING-point drive is
  # natural-scale (pk@5mW≈0.6-1.0, validated) but the 75 mW saturation peak (the
  # rare lognormal tail) reaches ~4-8, which the old 0.30 bound would block. The
  # real fSNN-stability gate is chr2_stability_check + n_sanitize_clipped /
  # n_nonfinite flags on the actual sys_id/model_fit runs — monitor those.
  peak_saturation_bound: 10.0

opsin_train_cold:
  # Hyperparams for the opsin_train_cold rule (COLD self-trained NN opsin).
  # Block was added to config_params.yaml + ultra_light_config_params.yaml in
  # commit c4aa3d2 but MISSED here (config regression fixed 2026-05-30).
  #
  # REDUCED from production (n_sequences 500, time_steps 500, epochs 5000):
  # at those sizes the data-gen (500 single-neuron Brian2 sims, each recompiling
  # Cython because the per-sim light TimedArray makes the generated code hash
  # unique) took ~138 min and 5000-epoch training pushed past the 180-min
  # walltime -> TIMEOUT on gpu-rtx6000 (job 9335869). The NN only needs to learn
  # a single-neuron deterministic light->photocurrent transfer; 80 sequences /
  # 2000 epochs is ample (0511 run showed the cold NN is functionally
  # interchangeable with the synthetic NN at k=m=32). USID's B' absorbs NN scale.
  n_sequences: 80
  time_steps: 300
  sequence_length: 200
  epochs: 2000
  batch_size: 16
  lr: 3e-3
  hidden_size: 32
  num_layers: 2
  scheduler_patience: 200
  scheduler_factor: 0.8
  scheduler_min_lr: 1.0e-6
  seed: 42
  # Sustained on/off block light (opsin saturation-coverage fix, 2026-06-14). Trains
  # the NN on piecewise-constant ON blocks (amp ~U(0,sustain_amp_max), held for
  # sustain_steps) + sustained-zero OFF blocks, instead of pure-white lognormal.
  # Fixes the zero-light offset (off-blocks) and the high-light marginal-slope
  # over-statement (sustained-high blocks). The "high" variant (amp_max=75,
  # sustain<=160) is best on commanded light: dynamic R²(NN,biophysical 500um) 0.9993
  # vs white 0.9973, deep-saturation [50,75) bin 0.86->0.98. const_block_fraction=0
  # reproduces legacy all-white. See personal_notes cold_eval opsin_block_training doc.
  const_block_fraction: 0.6
  sustain_amp_max: 75
  sustain_steps_min: 40
  sustain_steps_max: 160
  off_steps_min: 10
  off_steps_max: 40
  block_on_probability: 0.5

model_fit:
  linear_Cz: true

expts:
  u_max_mWmm2: 75
  # Record per-neuron photocurrent + membrane voltage during control for the
  # realized opsin-saturation diagnostic (analyze_ctrl_data.per_neuron_saturation,
  # ctrl_perneuron_* columns). OFF by default: recording all neurons adds
  # multiple GB of Brian2 monitor RAM. Enable for a dedicated per-neuron-
  # saturation run (recorded on the subsampled grid to keep RAM bounded).
  record_opto_per_neuron: false

sys_id_expts:
  foo: bar

natural_electrode_expts:
  natural_only: true
  n_trials_natural: 50

chr2_stability_check:
  # Verdict thresholds. ALL must hold for chr2_stable=True. Values are
  # generous for v1 — tighten after a single known-good cell completes
  # (rule of thumb: shrink each band by ~half once the nominal range
  # is empirically known).
  #
  # 0-light invariant. UnitlessChr2FourState resting Iopto is ~0 by
  # design; non-trivial leakage means broken plant wiring.
  iopto_max_abs_threshold: 0.01
  # Factor magnitude (rate-inflation proxy, mean(|X_chr2|)/mean(|y_bare|)).
  # At 0-light should sit ~1.0; opto inflation would push it > 1.
  factor_mag_ratio_min: 0.8
  factor_mag_ratio_max: 1.25
  # Z behavioral output magnitude shift.
  z_mean_ratio_min: 0.5
  z_mean_ratio_max: 2.0
  # Z divergence/saturation. Bare is subsampled to chr2's grid in the
  # analyzer so extreme-value statistics are sample-count-fair.
  z_max_ratio_max: 3.0

# =============================================================================
# cold_usid.yaml — COLD-side USID training hyperparameters.
#
# Loaded by src/model_fit/usid.py::_load_usid_config as the BASE config for USID
# (natural + USID subsystem) training inside COLD's model_fit rule. Replaces the
# former dependency on USID's snake-built snake/build/usid_model.merged.yaml.
#
# Override stack:
#   1. This file is loaded as the base.
#   2. Code overrides in _load_usid_config() inject runtime-dependent fields:
#      - data.source: "cold_inline"   (forces cold path inside usid_data_interface)
#      - models.ny                    (from sys_id data shape)
#      - models.n_clusters            (from cond_params.k)
#      - seed                         (from cond_params.seed)
#   3. COLD config's `usid_overrides:` block (if present) deep-merges on top.
#      `ultra_light_config.yaml` uses this to shorten epochs to 2.
#
# WARNING on step 3 vs step 2: `usid_overrides` is applied AFTER runtime
# injection, so it CAN clobber the runtime-owned keys listed above
# (data.source, models.ny, models.n_clusters, seed). Don't put any of
# those in `usid_overrides` — they will silently replace the runtime
# values and corrupt training (e.g., ny mismatch with sys_id data shape).
# If you need to touch those, do it in the calling code, not in YAML.
#
# Trimmed vs USID-synthetic merged.yaml:
#   * OMITTED (synthetic-only, dead in cold_inline mode):
#       input_data_gen/*, system/*, caching/*, data.{time_steps,
#       train_num_sequences, configs}, natural_results_dir, plot_num_samples,
#       plot_max_cols (latter two have getattr defaults so omitting is safe).
#   * OMITTED (architecturally dead in COLD):
#       oracle_natural, oracle_usid (no ground-truth fSNN matrices — training
#       core would raise ValueError anyway), no_opsin (runtime kwarg, not
#       config), training.lr_opsin_model (opsin frozen in COLD),
#       scheduler.step_size/gamma (only used under scheduler.type == step_lr).
#   * CHANGED:
#       data.source: synthetic -> cold_inline
#
# Keep this file in sync with USID-side intent when USID's training hyperparams
# evolve — it's maintained independently now.
# =============================================================================

seed: 42                   # Placeholder — overridden by _load_usid_config at runtime.

models:
  n1: 4                    # Natural subspace dim. Should roughly match fSNN's intrinsic dim.
  n2: 4                    # Unnatural subspace dim.
  ny: 1                    # Placeholder — overridden at runtime from sys_id data shape.
  n_clusters: 1            # Placeholder — overridden at runtime from cond_params.k.
  a_param_type: schur      # RealSchurParam (max_radius=0.99); alternative: ShearPolarRealSchurParam.

training:
  loss: mse
  optimizer: adam
  batch_size: 64
  wandb_logging: false
  save_checkpoints: true

scheduler:
  # NOTE on tuning: reduce_on_plateau with patience=20 + factor=0.8 requires
  # val_loss to fail to improve by 1e-4 (abs) for 20 consecutive epochs before
  # LR is cut by 20%. Generous for 200-epoch natural training; may never fire
  # during 100-epoch USID training. If loss plateaus without LR reductions
  # being logged, drop patience to ~10 or factor to 0.5 for more aggressive
  # annealing. min_lr=1e-4 vs natural-start 0.01 = ~2 decades of headroom;
  # vs usid-start 0.05 = ~2.7 decades.
  enabled: true
  type: reduce_on_plateau
  mode: min
  factor: 0.8
  patience: 20
  threshold: 1e-4
  threshold_mode: abs
  min_lr: 1e-4
  verbose: false

trainer:
  # AMP + torch.compile envelopes. Env vars USID_USE_AMP, USID_AMP_DTYPE,
  # USID_USE_COMPILE, USID_COMPILE_MODE, USID_COMPILE_BACKEND override these
  # at load time via scripts/utils/config_io.py.
  amp:
    enabled: false
    dtype: float16
  torch_compile:
    enabled: false
    mode: reduce-overhead
    backend: inductor

data:
  source: cold_inline      # Forces the cold path inside usid_data_interface.
                           # (Code also overrides this defensively in _load_usid_config.)

verbose_training_progress: true

natural_hyperparams:
  epochs: 200
  lr: 0.01
  rollout:
    K: 32
    W: 32
    schedule:
      K:
        mode: linear
        start: 32
        end: 80
        epochs: 30
  loss:
    loss_weights:
      delta: 1.0           # Teacher-forced 1-step MSE.
      rollout: 0.1         # Multi-step rollout MSE.
      teacher: 0.1         # Full-sequence teacher 1-step loss. Static value
                           # applies after the schedule's 20-epoch window
                           # (which currently ramps 0.0 → 0.0). Added 2026-05-04
                           # to fix R²(Y) over-scaling — `forward(Y, U)` was
                           # never directly penalized, so Yhat magnitude drifts.
      acf: 0.0             # Autocorrelation-matching loss (OFF).
      innov_white: 0.5     # Innovation-whiteness penalty. Realistic for COLD LFP
                           # — penalizes autocorrelation of y - C·x̂ at lags 1..10
                           # (burn_in=20). Improves observer-gain K1 quality.
      sroll: 0.0           # Sliding rollout (OFF).
      rvar: 0.0            # (OFF)
      spectral: 0.0        # (OFF)
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    huber_delta: 0.1
    rollout_weighting:
      type: exponential
      gamma: 0.97
      normalize: mean
    k_reg:
      enabled: false
      lambda_start: 1.0
      lambda_end: 0.01
      schedule_epochs: 30
      schedule_mode: exponential
    innovation_whiteness:
      num_lags: 10
      burn_in: 20          # Discards first 20 timesteps per window before ACF.
    sliding_rollout:
      burn_in: 30
      stride: 3
      K_short: 8
    acf_loss:
      num_lags: 30
      pretrain:
        enabled: false
        epochs: 100
        lr: 0.01
      freeze_A11: false
    schedule:
      # Per-epoch ramps on selected weights. Schedules override the static
      # loss_weights values during their active window.
      teacher:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 20
      rollout:
        mode: linear
        start: 0.1
        end: 0.1
        epochs: 20
      nstep_2:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 30
      nstep_3:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 40
      acf:
        mode: constant
        end: 0.0
        epochs: 30
  validation:
    loss_weights:
      delta: 1.0
      rollout: 0.2         # Slightly higher rollout weight at val for a
                           # generalization-sensitive metric.
      teacher: 0.0
      acf: 0.0
      innov_white: 0.0
      sroll: 0.0
      rvar: 0.0
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    rollout:
      K: 80
      W: 16
  window_seq_len: 128
  window_stride: 16
  train_split: 0.7
  val_split: 0.15
  subset_ratio: 0.5

# (oracle_natural omitted — architecturally incompatible with COLD (no ground-truth
# fSNN matrices). Leave absent; USID training_core handles absence via getattr.)

# (no_opsin omitted — a runtime kwarg to run_training, not read from cfg.)

usid_hyperparams:
  epochs: 100
  lr: 1e-2                 # Lowered from 5e-2 (2026-04-29). At 5e-2,
                           # rank-1-input cells (k=1, m=63) diverge after
                           # ~3 USID-phase steps via K=32 rollout
                           # amplification despite Adam + grad clipping.
                           # With Adam, per-step weight magnitude ≈ lr
                           # regardless of grad clip; lr IS the step-size
                           # knob. Multi-channel cells (k=22+) survived at
                           # 5e-2; this lower lr should keep them stable
                           # too with no expected accuracy cost.
  rollout:
    K: 32
    W: 16
  loss:
    loss_weights:
      delta: 1             # Teacher-forced 1-step MSE on USID output.
      rollout: 0.1         # Multi-step rollout MSE.
      teacher: 0.1         # Full-sequence teacher loss. Schedule below ramps
                           # 1.0 → 0.0 over first 20 epochs; after that, this
                           # static 0.1 applies (epochs 21-100). Added
                           # 2026-05-04 to keep teacher signal alive past the
                           # schedule window.
      sroll: 0.0
      spectral: 0.0
      ifp: 0.5             # Input-free penalty — active in COLD as of the
                           # natural_electrode_data integration in
                           # _prepare_data_bundle. IFP fires on samples marked
                           # is_input_free=True; COLD constructs those by
                           # slicing natural_YN at USID window dims and setting
                           # u to the no-input equivalent (zeros under
                           # use_opsin=True, -u_mean/u_std under z-scored).
                           # Sample ratio controlled by input_free_data_split
                           # below; input-free displaces input-driven 1:1 so
                           # total pool stays at N_opto windows. Matches
                           # scripts/usid_data_interface.py:371-417 synthetic
                           # logic. Disable by setting input_free_data_split=0.0.
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    huber_delta: 0.1
    rollout_weighting:
      type: exponential
      gamma: 0.97
      normalize: mean
    k_reg:
      enabled: false
      lambda_start: 1.0
      lambda_end: 0.01
      schedule_epochs: 30
      schedule_mode: exponential
    sliding_rollout:
      burn_in: 30
      stride: 3
      K_short: 8
    ifp:
      burn_in: 20
    schedule:
      # Schedules OVERRIDE the static loss_weights during the first N epochs.
      # Note: teacher starts at 1.0 then ramps to 0.0 — USID trains with
      # teacher-forcing ON for the first 20 epochs before switching to
      # rollout-dominated, even though static teacher weight is 0.
      teacher:
        mode: linear
        start: 1.0
        end: 0.0
        epochs: 20
      rollout:
        mode: linear
        start: 1.0
        end: 0.1
        epochs: 20
      delta:
        mode: linear
        start: 1.0
        end: 1.0
        epochs: 20
      nstep_2:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 30
      nstep_3:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 40
  validation:
    loss_weights:
      delta: 1.0
      rollout: 0.2
      teacher: 0.0
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    rollout:
      K: 80
      W: 16
  # Fraction of USID training pool filled from natural-electrode input-free
  # samples (natural_YN with u = no-input-equivalent). Displaces input-driven
  # opto samples 1:1 so total pool stays at N_opto windows. 0.0 disables.
  # Keep ≤ 0.5 in practice — at 1.0, mixed_target → 0 and there's no opto to
  # fit B' against.
  input_free_data_split: 0.5
  window_seq_len: 96
  window_stride: 16
  train_split: 0.7
  val_split: 0.15
  subset_ratio: 0.5

# (oracle_usid omitted — architecturally incompatible with COLD; same as oracle_natural.)

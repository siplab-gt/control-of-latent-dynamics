# =============================================================================
# cold_usid.yaml — COLD-side USID training hyperparameters.
#
# Loaded by src/model_fit/usid.py::_load_usid_config as the BASE config for USID
# (natural + USID subsystem) training inside COLD's model_fit rule. Replaces the
# former dependency on USID's snake-built snake/build/usid_model.merged.yaml.
#
# Override stack:
#   1. This file is loaded as the base.
#   2. Code overrides in _load_usid_config() inject runtime-dependent fields:
#      - data.source: "cold_inline"   (forces cold path inside usid_data_interface)
#      - models.ny                    (from sys_id data shape)
#      - models.n_clusters            (from cond_params.k)
#      - seed                         (from cond_params.seed)
#   3. COLD config's `usid_overrides:` block (if present) deep-merges on top.
#      `ultra_light_config.yaml` uses this to shorten epochs to 2.
#
# WARNING on step 3 vs step 2: `usid_overrides` is applied AFTER runtime
# injection, so it CAN clobber the runtime-owned keys listed above
# (data.source, models.ny, models.n_clusters, seed). Don't put any of
# those in `usid_overrides` — they will silently replace the runtime
# values and corrupt training (e.g., ny mismatch with sys_id data shape).
# If you need to touch those, do it in the calling code, not in YAML.
#
# Trimmed vs USID-synthetic merged.yaml:
#   * OMITTED (synthetic-only, dead in cold_inline mode):
#       input_data_gen/*, system/*, caching/*, data.{time_steps,
#       train_num_sequences, configs}, natural_results_dir, plot_num_samples,
#       plot_max_cols (latter two have getattr defaults so omitting is safe).
#   * OMITTED (architecturally dead in COLD):
#       oracle_natural, oracle_usid (no ground-truth fSNN matrices — training
#       core would raise ValueError anyway), no_opsin (runtime kwarg, not
#       config), training.lr_opsin_model (opsin frozen in COLD),
#       scheduler.step_size/gamma (only used under scheduler.type == step_lr).
#   * CHANGED:
#       data.source: synthetic -> cold_inline
#
# Keep this file in sync with USID-side intent when USID's training hyperparams
# evolve — it's maintained independently now.
# =============================================================================

seed: 42                   # Placeholder — overridden by _load_usid_config at runtime.

models:
  n1: 8                    # Natural subspace dim. Should roughly match fSNN's intrinsic dim.
  n2: 8                    # Unnatural subspace dim.
  ny: 1                    # Placeholder — overridden at runtime from sys_id data shape.
  n_clusters: 1            # Placeholder — overridden at runtime from cond_params.k.
  a_param_type: schur      # RealSchurParam (max_radius=0.99); alternative: ShearPolarRealSchurParam.

training:
  loss: mse
  optimizer: adam
  batch_size: 64
  wandb_logging: false
  save_checkpoints: true

scheduler:
  # NOTE on tuning: reduce_on_plateau with patience=20 + factor=0.8 requires
  # val_loss to fail to improve by 1e-4 (abs) for 20 consecutive epochs before
  # LR is cut by 20%. Generous for 200-epoch natural training; may never fire
  # during 100-epoch USID training. If loss plateaus without LR reductions
  # being logged, drop patience to ~10 or factor to 0.5 for more aggressive
  # annealing. min_lr=1e-4 vs natural-start 0.01 = ~2 decades of headroom;
  # vs usid-start 0.05 = ~2.7 decades.
  enabled: true
  type: reduce_on_plateau
  mode: min
  factor: 0.8
  patience: 20
  threshold: 1e-4
  threshold_mode: abs
  min_lr: 1e-4
  verbose: false

trainer:
  # AMP + torch.compile envelopes. Env vars USID_USE_AMP, USID_AMP_DTYPE,
  # USID_USE_COMPILE, USID_COMPILE_MODE, USID_COMPILE_BACKEND override these
  # at load time via scripts/utils/config_io.py.
  amp:
    enabled: false
    dtype: float16
  torch_compile:
    enabled: false
    mode: reduce-overhead
    backend: inductor

data:
  source: cold_inline      # Forces the cold path inside usid_data_interface.
                           # (Code also overrides this defensively in _load_usid_config.)

diagnostics:
  enabled: false           # COLD inline model_fit: skip the ~98s of matplotlib +
                           # rollout-R2 diagnostics in usid.py. They are not consumed by
                           # the LDS handoff or analyze_model_fit; set true for single-cell
                           # debugging. The synthetic path is unaffected (it calls
                           # run_shared_diagnostics directly, not via usid.py).

verbose_training_progress: true

natural_hyperparams:
  epochs: 200
  lr: 0.01
  rollout:
    K: 32
    W: 32
    schedule:
      K:
        mode: linear
        start: 32
        end: 80
        epochs: 30
  loss:
    loss_weights:
      delta: 1.0           # Teacher-forced 1-step MSE.
      rollout: 0.1         # Multi-step rollout MSE.
      teacher: 0.1         # Full-sequence teacher 1-step loss. Static value
                           # applies after the schedule's 20-epoch window
                           # (which currently ramps 0.0 → 0.0). Added 2026-05-04
                           # to fix R²(Y) over-scaling — `forward(Y, U)` was
                           # never directly penalized, so Yhat magnitude drifts.
      acf: 0.0             # Autocorrelation-matching loss (OFF).
      innov_white: 0.5     # Innovation-whiteness penalty. Realistic for COLD LFP
                           # — penalizes autocorrelation of y - C·x̂ at lags 1..10
                           # (burn_in=20). Improves observer-gain K1 quality.
      sroll: 0.0           # Sliding rollout (OFF).
      rvar: 0.0            # (OFF)
      spectral: 0.0        # (OFF)
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    huber_delta: 0.1
    rollout_weighting:
      type: exponential
      gamma: 0.97
      normalize: mean
    k_reg:
      enabled: false
      lambda_start: 1.0
      lambda_end: 0.01
      schedule_epochs: 30
      schedule_mode: exponential
    innovation_whiteness:
      num_lags: 10
      burn_in: 20          # Discards first 20 timesteps per window before ACF.
    sliding_rollout:
      burn_in: 30
      stride: 3
      K_short: 8
    acf_loss:
      num_lags: 30
      pretrain:
        enabled: false
        epochs: 100
        lr: 0.01
      freeze_A11: false
    schedule:
      # Per-epoch ramps on selected weights. Schedules override the static
      # loss_weights values during their active window.
      teacher:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 20
      rollout:
        mode: linear
        start: 0.1
        end: 0.1
        epochs: 20
      nstep_2:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 30
      nstep_3:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 40
      acf:
        mode: constant
        end: 0.0
        epochs: 30
  validation:
    loss_weights:
      delta: 1.0
      rollout: 0.2         # Slightly higher rollout weight at val for a
                           # generalization-sensitive metric.
      teacher: 0.0
      acf: 0.0
      innov_white: 0.0
      sroll: 0.0
      rvar: 0.0
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    rollout:
      K: 80
      W: 16
  window_seq_len: 128
  window_stride: 16
  train_split: 0.7
  val_split: 0.15
  subset_ratio: 0.5

# (oracle_natural omitted — architecturally incompatible with COLD (no ground-truth
# fSNN matrices). Leave absent; USID training_core handles absence via getattr.)

# (no_opsin omitted — a runtime kwarg to run_training, not read from cfg.)

usid_hyperparams:
  epochs: 100
  n_restarts: 1            # Multistart: fit this many independent USID models
                           # (distinct torch init seed, same sys-id data) and keep the
                           # best one by multistart_selector (src/model_fit/usid.py).
                           # The USID+opsin objective is multimodal, so different inits
                           # land in different optima (the seed lottery). Selection is
                           # open-loop / pre-control (no closed-loop Q peeking), the
                           # deployable criterion. 1 = single fit (no multistart),
                           # byte-identical to the pre-multistart path.
  multistart_selector: freerun_r2y  # How multistart (n_restarts>1) picks the kept model.
                           # 'freerun_r2y' (corrected default): MAX held-out observer-OFF
                           # forced-path R2(Y) — self-fed free-run where opto reaches the
                           # output ONLY through B2', scoring the control-relevant input
                           # path the Kalman observer cannot fake (for pin_bprime, scored
                           # on a pinned deepcopy). 'val_loss': MIN held-out USID validation
                           # loss (observer-ON, Kalman-masked; ~uncorrelated with control
                           # Q — the prior, broken criterion).
  pin_bprime: false        # Post-training: identify the opsin/forced input map B2'
                           # by a convex fit to the predictor free-run output
                           # (src/model_fit/usid.py::_pin_bprime), overwriting the
                           # Kalman-masked B2' from joint training; B1' pinned to 0.
                           # No other matrix is retrained. Reuses cz_observer_horizon
                           # as the pooled fit horizon. false = off (masked B2').
                           # PRIMARY KNOB to sweep alongside forced.
  lr: 1e-2                 # Lowered from 5e-2 (2026-04-29). At 5e-2,
                           # rank-1-input cells (k=1, m=63) diverge after
                           # ~3 USID-phase steps via K=32 rollout
                           # amplification despite Adam + grad clipping.
                           # With Adam, per-step weight magnitude ≈ lr
                           # regardless of grad clip; lr IS the step-size
                           # knob. Multi-channel cells (k=22+) survived at
                           # 5e-2; this lower lr should keep them stable
                           # too with no expected accuracy cost.
  rollout:
    K: 32
    W: 16
  loss:
    loss_weights:
      delta: 1             # Teacher-forced 1-step MSE on USID output.
      rollout: 0.1         # Multi-step rollout MSE.
      teacher: 0.1         # Full-sequence teacher loss. Schedule below ramps
                           # 1.0 → 0.0 over first 20 epochs; after that, this
                           # static 0.1 applies (epochs 21-100). Added
                           # 2026-05-04 to keep teacher signal alive past the
                           # schedule window.
      sroll: 0.0
      spectral: 0.0
      forced: 1.0          # K-suppressed open-loop forced loss: scores the
                           # observer-OFF (K1=K2=0) forced rollout — input path
                           # B'·photocurrent only — against the true output, to
                           # IDENTIFY B'/A22/A12/Cy2 against the opto->output map.
                           # The dominant teacher-forced delta and observer-on
                           # rollout terms leave that map masked (strong K·y feedback
                           # satisfies them regardless of B'), so without this the
                           # USID forced/open-loop response the controller plans
                           # against is unidentified. This is a LOSS TERM, not a
                           # penalty on K's magnitude. PRIMARY KNOB to sweep; 0 = off
                           # (recovers the prior behaviour). Reuses the usid rollout
                           # W/K horizon.
      ifp: 0.5             # Input-free penalty — active in COLD as of the
                           # natural_electrode_data integration in
                           # _prepare_data_bundle. IFP fires on samples marked
                           # is_input_free=True; COLD constructs those by
                           # slicing natural_YN at USID window dims and setting
                           # u to the no-input equivalent (zeros under
                           # use_opsin=True, -u_mean/u_std under z-scored).
                           # Sample ratio controlled by input_free_data_split
                           # below; input-free displaces input-driven 1:1 so
                           # total pool stays at N_opto windows. Matches
                           # scripts/usid_data_interface.py:371-417 synthetic
                           # logic. Disable by setting input_free_data_split=0.0.
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    huber_delta: 0.1
    rollout_weighting:
      type: exponential
      gamma: 0.97
      normalize: mean
    k_reg:
      enabled: false
      lambda_start: 1.0
      lambda_end: 0.01
      schedule_epochs: 30
      schedule_mode: exponential
    k2_zero: false           # Hard K2==0 for the whole USID phase (observer-off
                             # unnatural subspace). |lambda|->inf limit of k_reg;
                             # x2 driven only by B2'·p (+ autonomous A22). Routed
                             # per-cell by the k2_treat model_fit wildcard via the
                             # k2_treatments presets below. Default off.
    z_recon:                 # STAGE 4 — learnable-Cz Phase-3 finetune of {Cz2,B2'} (Cz1 frozen from
                             # STAGE 1b). Inert unless usid_hyperparams.learnable_cz=True (which also
                             # requires k2_zero=True). Trains on z_weight·decode_Z + y_weight·forced_Y
                             # (the retained Y anchor). See src/model_fit/usid.py::_finetune_cz_phase3.
                             # ATTRIBUTION/SCIENCE version (deferred, out of scope): would hold B2'
                             # minimal (penalize ‖B2'‖/‖Cz2·x2‖) + keep a clean residual split, and
                             # REQUIRES the D2 colored-noise natural model (not built). See
                             # scratchpad/natural_unnatural_d2_and_cz_handling.md.
      z_weight: 10.0         # z/anchor weight ratio; frontier sweet spot ~10 (large opto->Z direction
                             # gain, ΔR2(Y)≈-0.02). Higher -> more Z, more Y cost.
      y_weight: 1.0          # forced-path Y anchor weight (was hard-coded 1.0; now in config).
      horizon: 10            # observer-rollout depth (matches the 100ms / 10-sample control horizon).
                             # NOTE: the model is TRAINED to fit Z at depths 1..10, but the diagnostic
                             # R2_freerun_Z_h* / cz_r2y_* are also reported at h20 (cz_observer_horizon)
                             # — beyond the training horizon. Compare learned-vs-ridge at h10 (the honest
                             # apples-to-apples horizon); h20 understates the learned arm.
      steps: 400             # Adam finetune steps over the (subsampled) rollout pool
      lr: 5.0e-3
      huber_delta: 0.0       # 0 -> MSE; >0 -> Huber on the kept (variance-carrying) channels
    b1_recon:                # STAGE 2 — B1' pretrain (in run_training, BEFORE the unnatural matrices).
                             # Trains ONLY B1' (x2≡0; pure natural-path readouts) on
                             # z_weight·decode_Z(Cz1·x1) + y_weight·forced_Y(Cy1·x1) so the natural opto
                             # input map is shaped by behavior (z) and LFP (y). Independent z/y weights
                             # let us tune B1' to be more z- or y-faithful; set EQUAL to z_recon for now.
                             # Inert unless learnable_cz=True. ATTRIBUTION version would BOUND B1' (norm
                             # / typical-regime cap); see the scratchpad reference above.
      z_weight: 10.0
      y_weight: 1.0
      horizon: 10
      steps: 400
      lr: 5.0e-3
      huber_delta: 0.0
    cz1_recon:               # STAGE 1b — Cz1 fit on OPTO-FREE behavior, then frozen (the behavioral
                             # gatekeeper). Ridge warm-start (the standalone-linear decode is convex →
                             # this IS the optimum) + a Cz1-only gradient finetune, run for COHESION with
                             # the gradient-trained Cz2/B1' (it stays at the ridge optimum). Inert unless
                             # learnable_cz=True. No z/y weights: pure behavioral decode (Cz1 doesn't
                             # touch Y), so only the finetune hyperparams.
      steps: 400
      lr: 5.0e-3
    sliding_rollout:
      burn_in: 30
      stride: 3
      K_short: 8
    ifp:
      burn_in: 20
    schedule:
      # Schedules OVERRIDE the static loss_weights during the first N epochs.
      # Note: teacher starts at 1.0 then ramps to 0.0 — USID trains with
      # teacher-forcing ON for the first 20 epochs before switching to
      # rollout-dominated, even though static teacher weight is 0.
      teacher:
        mode: linear
        start: 1.0
        end: 0.0
        epochs: 20
      rollout:
        mode: linear
        start: 1.0
        end: 0.1
        epochs: 20
      nstep_2:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 30
      nstep_3:
        mode: linear
        start: 0.0
        end: 0.0
        epochs: 40
  validation:
    loss_weights:
      delta: 1.0
      rollout: 0.2
      teacher: 0.0
      forced: 0.0          # Diagnostic only: forced_raw (forced-rollout MSE) is
                           # tracked at val even at weight 0, so the validation
                           # forced fit is visible without changing the val-loss
                           # composition the scheduler / early-stop key on.
      nstep:
        '2': 0.0
        '3': 0.0
        '5': 0.0
    rollout:
      K: 80
      W: 16
  # Fraction of USID training pool filled from natural-electrode input-free
  # samples (natural_YN with u = no-input-equivalent). Displaces input-driven
  # opto samples 1:1 so total pool stays at N_opto windows. 0.0 disables.
  # Keep ≤ 0.5 in practice — at 1.0, mixed_target → 0 and there's no opto to
  # fit B' against.
  input_free_data_split: 0.5
  window_seq_len: 96
  window_stride: 16
  train_split: 0.7
  val_split: 0.15
  subset_ratio: 0.5
  # Behavioral-decoder (Cz) fit mode. The NLMPC/iLQR controllers plan against
  # the OBSERVER free-run state (self-fed y = C·x, Kalman gain K still applied),
  # NOT the teacher-forced (real-y, Kalman-corrected) state the model is
  # validated on. Fitting Cz on the teacher-forced 1-step state therefore reads
  # Z out of the wrong trajectory and the controller's planned Z is poor.
  #   - "teacher_forced": Ridge-fit Cz on the 1-step filtered/observer state
  #     (legacy behaviour; matches the state the model is trained against).
  #   - "observer_rollout": Ridge-fit Cz on the observer free-run state POOLED
  #     over rollout horizons j=1..cz_observer_horizon — the states the
  #     controller actually visits when planning. Lifts observer-form held-out
  #     R²(Z) at the control horizon from ~−0.04 to ~+0.16 @h20 (offline-
  #     validated on the cached usid_stim_rec chr2 cells; see
  #     tmp/cold_investigation/wave3_B_solution_integration.md PART 1b).
  cz_fit_mode: observer_rollout
  # NOTE: when learnable_cz=True, cz_fit_mode selects the WARM-START ridge only (the deployed Cz is
  # then the Phase-3 trained one); it governs the deployed decoder only when learnable_cz=False.
  # Rollout depth (in samples) to pool the observer free-run state over when
  # cz_fit_mode == "observer_rollout". 20 = the 200 ms control horizon at the
  # subsample_factor=10 (10 ms) controller grid (ctrl_horizon_ms=200). Pooling
  # j=1..H (rather than fitting at a single far horizon) keeps the near-horizon
  # readout — which the replanning MPC realizes most — intact while still
  # lifting the tail.
  cz_observer_horizon: 20
  # Opto-response weight for cz_fit_mode == "two_term". The Cz fit blends the
  # observer_rollout decode term with an opto-response term that aligns Cz to
  # the 2SLS opto-as-instrument estimate of the opto-evoked behavior (see
  # src/model_fit/usid.py::_fit_behavioral_decoder). 0.0 == pure decode
  # (reproduces observer_rollout); 1.0 == pure opto-response. Inert unless
  # cz_fit_mode == "two_term".
  cz_lambda: 0.0
  # Learnable behavioral decoder (Option 2 reframed). When True, Cz1/Cz2 become trained
  # nn.Parameters: a Phase-3 finetune (after the dynamics are trained on neural Y) warm-starts them
  # from the ridge, then trains {Cz1,Cz2,B2'} on the loss.z_recon objective + the retained forced-path
  # Y anchor. Requires k2_zero=True, pin_bprime=False, n_restarts==1, use_opsin=True (asserted in
  # usid.py). False -> the post-hoc ridge governs (cz_fit_mode/cz_lambda). COLD-only (no behavioral Z
  # in standalone synthetic). Routed per-cell by the cz_treat model_fit wildcard.
  learnable_cz: false

# (oracle_usid omitted — architecturally incompatible with COLD; same as oracle_natural.)

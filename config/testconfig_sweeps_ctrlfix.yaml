# =============================================================================
# testconfig_sweeps_ctrlfix.yaml — Test 1: NLMPC controller-correctness diagnostic.
#
# Hypothesis (Carl's #1): NLMPC under-performs LQMPC and over-drives purely
# because its optimizer was un-converged (cached runs used nlmpc_grad_iters=5:
# 5 Adam steps at lr 0.5 from a zero warm-start). On linear-Cz BRAID with no
# opsin, NLMPC and LQMPC minimize the IDENTICAL convex objective (NLMPC's loss
# is LQMPC's QP cost / H — same argmin), over the same box, dynamics, and
# Kalman estimator. So a CONVERGED NLMPC must reach LQMPC's optimum; any
# residual gap after convergence is a deeper controller bug.
#
# Design: reproduce the gap at nlmpc_grad_iters=5 and test the convergence fix
# at nlmpc_grad_iters=300 (converges ~216, real-dim gate), on ONE saturating (phim_scale=1, NOT linearized)
# plant. linear-Cz braid_stim_rec ONLY — nonlinear-Cz BRAID would have LQMPC
# linearize Cz at x=0 while NLMPC uses the true MLP, breaking the invariant.
#
# Cells: 5 seeds × ctrl{LQMPC,NLMPC} × setting{braid_stim_rec}
#        × nlmpc_grad_iters{5,300} × n_trials_sys_id{50} × (k,m)=(32,32)
#   = 20 ctrl_expts cells (LQMPC is duplicated across the nlmpc axis —
#     redundant but cheap; its result is iter-independent) + auto NULL baselines.
#   BRAID model_fit only (no USID/opsin training). Default plant: phim_scale=1,
#   target_iopto=0.0575, ctrl_horizon_ms=200, Q_cost=1, R_cost=1e-3.
# =============================================================================

sweeps:
  seed:
    - 17230616
    - 18051223
    - 16320829
    - 18060520
    - 18220427
  ctrl_type:
    - LQMPC
    - NLMPC
  setting:
    - braid_stim_rec
  nlmpc_grad_iters:
    - 5
    - 300
  n_trials_sys_id:
    - 50

q_usid:
  channel_budget: 64
  num_stim_ratio_levels: 3
  target_k: 32
